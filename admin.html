<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نظام إدارة المتجر المتكامل - النسخة المتطورة</title>
    <!-- مكتبات خارجية -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --sidebar-bg: #0f172a;
            --sidebar-text: #e2e8f0;
            --primary: #6D001A;
            --primary-light: #9f1239;
            --accent-blue: #0ea5e9;
            --accent-pink: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --sidebar-bg: #020617;
            --sidebar-text: #cbd5e1;
        }
        
        body {
            background: var(--bg-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        
        /* شاشة تسجيل الدخول */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: fixed;
            width: 100%;
            z-index: 1000;
        }
        
        .login-card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* التخطيط الرئيسي */
        .app-layout {
            display: none;
        }
        
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            transition: all 0.3s;
            z-index: 100;
            overflow-y: auto;
            box-shadow: 4px 0 10px rgba(0,0,0,0.2);
        }
        
        .main-content {
            margin-right: 280px;
            padding: 20px;
            min-height: 100vh;
        }
        
        .sidebar-header {
            padding: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: 0.3s;
            margin: 5px 0;
        }
        
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: var(--primary);
            color: white;
            border-radius: 12px;
            margin: 5px 12px;
        }
        
        /* بطاقات الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }
        
        .stat-card:hover { transform: translateY(-5px); }
        
        /* الجداول والنماذج */
        .data-table {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            overflow-x: auto;
            border-collapse: collapse;
        }
        
        .data-table th, .data-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: scale(1.02); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 13px; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .sidebar { right: -280px; }
            .sidebar.open { right: 0; }
            .main-content { margin-right: 0; }
            .menu-toggle { display: block; position: fixed; top: 15px; right: 15px; z-index: 101; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 12px; }
        }
        
        .theme-toggle { cursor: pointer; padding: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="login-container" id="loginContainer">
    <div class="login-card">
        <div class="logo" style="text-align: center; margin-bottom: 30px;">
            <h1 style="color: var(--primary);">Store <span style="color:#333;">System</span></h1>
            <p>نظام إدارة المتجر المتكامل</p>
        </div>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" style="width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1px solid #ddd;">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" style="width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1px solid #ddd;">
        <div id="loginError" style="color:red; display:none; margin:10px 0;">بيانات غير صحيحة</div>
        <button class="btn btn-primary" style="width:100%; padding:14px;" id="doLogin">دخول</button>
        <div style="margin-top:15px; font-size:12px; color:#666; text-align:center;">
        </div>
    </div>
</div>

<div class="app-layout" id="appLayout">
    <button class="menu-toggle" id="mobileMenuToggle"><i class="bi bi-list"></i></button>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Store <span style="color:var(--primary);">System</span></h2>
            <div style="margin-top:15px; display:flex; justify-content:center; gap:10px;">
                <div class="theme-toggle" id="themeToggle"><i class="bi bi-moon-stars"></i></div>
                <div class="theme-toggle" id="langToggle"><i class="bi bi-translate"></i></div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a data-page="dashboard"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
            <a data-page="products"><i class="bi bi-box-seam"></i> المنتجات</a>
            <a data-page="orders"><i class="bi bi-cart-check"></i> الطلبات</a>
            <a data-page="customers"><i class="bi bi-people"></i> العملاء</a>
            <a data-page="suppliers"><i class="bi bi-truck"></i> الموردين</a>
            <a data-page="coupons"><i class="bi bi-ticket-perforated"></i> الكوبونات</a>
            <a data-page="analytics"><i class="bi bi-graph-up"></i> التحليلات</a>
            <a data-page="logs"><i class="bi bi-journal-text"></i> سجل العمليات</a>
            <a data-page="settings"><i class="bi bi-gear"></i> الإعدادات</a>
            <a id="logoutBtn" style="margin-top:30px; color:#f87171;"><i class="bi bi-box-arrow-right"></i> خروج</a>
        </nav>
    </aside>
    <main class="main-content" id="mainContent"></main>
</div>

<script>

    // === كود التزامن بين نظام الإدارة ومتجر الألعاب ===
(function syncStoreAndGame() {
    const ADMIN_KEY = 'advanced_store_data';
    const GAME_PRODUCTS_KEY = 'games_store_products';
    const GAME_ORDERS_KEY = 'games_store_orders';
    const GAME_CART_KEY = 'games_store_cart';
    
    // دالة لمزامنة المنتجات من الإدارة إلى الألعاب
    function syncProductsFromAdmin() {
        const adminData = localStorage.getItem(ADMIN_KEY);
        if (adminData) {
            const parsed = JSON.parse(adminData);
            if (parsed.products && Array.isArray(parsed.products)) {
                // تحويل المنتجات إلى صيغة متجر الألعاب
                const gameProducts = parsed.products.map(p => ({
                    id: p.id,
                    name: p.name,
                    category: p.category || 'ألعاب',
                    price: p.price,
                    image: p.image?.startsWith('data:') ? p.image : (p.image || 'https://via.placeholder.com/400'),
                    premium: p.price > 2000
                }));
                localStorage.setItem(GAME_PRODUCTS_KEY, JSON.stringify(gameProducts));
            }
        }
    }
    
    // دالة لمزامنة الطلبات الجديدة من الألعاب إلى الإدارة
    function syncOrdersToAdmin() {
        const gameOrders = localStorage.getItem(GAME_ORDERS_KEY);
        const adminData = localStorage.getItem(ADMIN_KEY);
        if (gameOrders && adminData) {
            const ordersGame = JSON.parse(gameOrders);
            const admin = JSON.parse(adminData);
            if (!admin.orders) admin.orders = [];
            
            let updated = false;
            ordersGame.forEach(order => {
                // تحويل صيغة طلب الألعاب إلى صيغة الإدارة
                const exists = admin.orders.some(o => o.id === order.id);
                if (!exists) {
                    admin.orders.push({
                        id: order.id,
                        productId: order.items?.[0]?.id || 0,
                        quantity: order.items?.reduce((s, i) => s + i.quantity, 0) || 1,
                        total: order.total,
                        status: order.status === 'قيد الانتظار' ? 'pending' : 'completed',
                        date: order.createdAt || new Date().toISOString(),
                        customer: 'عميل المتجر',
                        customerId: null,
                        couponCode: null
                    });
                    updated = true;
                }
            });
            if (updated) {
                localStorage.setItem(ADMIN_KEY, JSON.stringify(admin));
                // إشعار التحديث لبقية النوافذ
                window.dispatchEvent(new StorageEvent('storage', { key: ADMIN_KEY, newValue: JSON.stringify(admin) }));
            }
        }
    }
    
    // مراقبة التغييرات في localStorage
    window.addEventListener('storage', (e) => {
        if (e.key === ADMIN_KEY && e.newValue) {
            syncProductsFromAdmin();
        }
        if (e.key === GAME_ORDERS_KEY && e.newValue) {
            syncOrdersToAdmin();
        }
    });
    
    // التنفيذ الأولي
    syncProductsFromAdmin();
    syncOrdersToAdmin();
    
    // تحديث دوري (اختياري) لتجنب فقدان التغييرات في نفس النافذة
    setInterval(() => {
        syncProductsFromAdmin();
        syncOrdersToAdmin();
    }, 5000);
})();

    // ------------------- البيانات الأساسية -------------------
    let storeData = {
        products: [],
        orders: [],
        users: [],
        suppliers: [],
        coupons: [],
        logs: [],
        settings: { storeName: "متجر المتكامل", currency: "$", darkMode: false, language: "ar" }
    };
    
    let currentUser = null;
    let currentPage = "dashboard";
    let charts = {};
    
    // تحميل البيانات
    function loadStoreData() {
        const saved = localStorage.getItem("advanced_store_data");
        if(saved) {
            storeData = JSON.parse(saved);
        } else {
            // بيانات أولية
            storeData.products = [
                { id: 1, name: "هاتف ذكي", price: 1200, stock: 15, image: "📱", category: "الكترونيات", salesCount: 12 },
                { id: 2, name: "حاسوب محمول", price: 4500, stock: 7, image: "💻", category: "الكترونيات", salesCount: 5 },
                { id: 3, name: "سماعات", price: 250, stock: 30, image: "🎧", category: "اكسسوارات", salesCount: 20 }
            ];
            storeData.orders = [
                { id: 1001, productId: 1, quantity: 2, total: 2400, status: "completed", date: new Date().toISOString(), customer: "أحمد علي", customerId: 1, couponCode: null },
                { id: 1002, productId: 2, quantity: 1, total: 4500, status: "pending", date: new Date().toISOString(), customer: "سارة محمود", customerId: 2, couponCode: null }
            ];
            storeData.users = [
                { id: 1, name: "مدير النظام", email: "mazin0968852427@gmail.com", password: btoa("panda@2025"), role: "admin" },
                { id: 2, name: "موظف المبيعات", email: "staff@store.com", password: btoa("staff123"), role: "staff" },
                { id: 3, name: "مشاهد", email: "viewer@store.com", password: btoa("view123"), role: "viewer" }
            ];
            storeData.suppliers = [
                { id: 1, name: "شركة التقنية", contact: "tech@mail.com", phone: "0500000000", products: [1,2] }
            ];
            storeData.coupons = [
                { code: "SAVE10", discount: 10, type: "percent", expiry: "2025-12-31", active: true }
            ];
            storeData.logs = [];
            addLog("system", "تم تهيئة النظام");
            saveStoreData();
        }
        applySettings();
    }
    
    function saveStoreData() {
        localStorage.setItem("advanced_store_data", JSON.stringify(storeData));
        // إشعار المتصفح (للتزامن بين التبويبات)
        window.dispatchEvent(new StorageEvent('storage', { key: 'advanced_store_data', newValue: JSON.stringify(storeData) }));
    }
    
    function addLog(action, details) {
        storeData.logs.unshift({ id: Date.now(), user: currentUser?.name || "system", action, details, time: new Date().toISOString() });
        if(storeData.logs.length > 200) storeData.logs.pop();
        saveStoreData();
    }
    
    function applySettings() {
        if(storeData.settings.darkMode) document.body.classList.add("dark");
        else document.body.classList.remove("dark");
        document.dir = storeData.settings.language === "ar" ? "rtl" : "ltr";
        document.documentElement.lang = storeData.settings.language;
    }
    
    // صلاحيات
    function hasPermission(action) {
        if(!currentUser) return false;
        if(currentUser.role === "admin") return true;
        if(currentUser.role === "staff") return ["products", "orders", "dashboard", "customers"].includes(action) || action === "view";
        if(currentUser.role === "viewer") return action === "dashboard" || action === "view";
        return false;
    }
    
    // عرض الصفحات
    async function renderPage() {
        if(!hasPermission(currentPage) && currentPage !== "dashboard") {
            showToast("ليس لديك صلاحية", "error");
            currentPage = "dashboard";
        }
        const container = document.getElementById("mainContent");
        if(currentPage === "dashboard") await renderDashboard(container);
        else if(currentPage === "products") renderProducts(container);
        else if(currentPage === "orders") renderOrders(container);
        else if(currentPage === "customers") renderCustomers(container);
        else if(currentPage === "suppliers") renderSuppliers(container);
        else if(currentPage === "coupons") renderCoupons(container);
        else if(currentPage === "analytics") renderAnalytics(container);
        else if(currentPage === "logs") renderLogs(container);
        else if(currentPage === "settings") renderSettings(container);
        
        document.querySelectorAll(".sidebar-nav a").forEach(link => {
            if(link.dataset.page === currentPage) link.classList.add("active");
            else link.classList.remove("active");
        });
    }
    
    // عرض لوحة التحكم المتطورة
    async function renderDashboard(container) {
        const completedOrders = storeData.orders.filter(o => o.status === "completed");
        const totalRevenue = completedOrders.reduce((s,o) => s + o.total, 0);
        const totalOrders = storeData.orders.length;
        const pendingOrders = storeData.orders.filter(o => o.status === "pending").length;
        const lowStock = storeData.products.filter(p => p.stock < 5).length;
        const topProducts = [...storeData.products].sort((a,b) => b.salesCount - a.salesCount).slice(0,5);
        
        container.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                <h1><i class="bi bi-house-door"></i> لوحة التحكم</h1>
                <div>${new Date().toLocaleDateString('ar-EG')}</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div><div class="stat-label">إجمالي المبيعات</div><div class="stat-value" style="font-size:28px; font-weight:bold;">${storeData.settings.currency}${totalRevenue}</div></div><i class="bi bi-cash-stack" style="font-size:32px; color:var(--accent-blue);"></i></div>
                <div class="stat-card"><div><div class="stat-label">الطلبات</div><div class="stat-value">${totalOrders}</div></div><i class="bi bi-cart" style="font-size:32px; color:var(--accent-pink);"></i></div>
                <div class="stat-card"><div><div class="stat-label">معلق</div><div class="stat-value">${pendingOrders}</div></div><i class="bi bi-clock" style="font-size:32px; color:var(--warning);"></i></div>
                <div class="stat-card"><div><div class="stat-label">منتجات منخفضة المخزون</div><div class="stat-value">${lowStock}</div></div><i class="bi bi-exclamation-triangle" style="font-size:32px; color:var(--danger);"></i></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div class="stat-card" style="padding:20px;"><canvas id="salesChart"></canvas></div>
                <div class="stat-card"><h3>🏆 أفضل المنتجات</h3><ul>${topProducts.map(p => `<li>${p.name} - ${p.salesCount} مبيعات</li>`).join('')}</ul></div>
            </div>
            <div class="stat-card" style="margin-top:20px;"><h3>📋 آخر الطلبات</h3><table class="data-table"><thead><tr><th>#</th><th>العميل</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${storeData.orders.slice(0,5).map(o => `<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.total}</td><td>${o.status === "completed" ? "مكتمل" : "معلق"}</td></tr>`).join('')}</tbody></table></div>
        `;
        // رسم بياني شهري
        const monthly = {};
        storeData.orders.forEach(o => {
            const month = new Date(o.date).getMonth();
            monthly[month] = (monthly[month] || 0) + o.total;
        });
        const ctx = document.getElementById('salesChart')?.getContext('2d');
        if(ctx) {
            if(charts.salesChart) charts.salesChart.destroy();
            charts.salesChart = new Chart(ctx, {
                type: 'line',
                data: { labels: Object.keys(monthly).map(m => `شهر ${parseInt(m)+1}`), datasets: [{ label: 'المبيعات', data: Object.values(monthly), borderColor: '#6D001A', tension: 0.3 }] }
            });
        }
    }
    
    // دالة استيراد المنتجات من JSON
    function importProductsFromJSON(file, mergeMode) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                let productsArray = [];
                // السماح بأن يكون الملف إما مصفوفة مباشرة أو كائن يحتوي على حقل products
                if (Array.isArray(imported)) {
                    productsArray = imported;
                } else if (imported.products && Array.isArray(imported.products)) {
                    productsArray = imported.products;
                } else {
                    throw new Error("الملف يجب أن يحتوي على مصفوفة منتجات أو كائن بمفتاح products");
                }
                
                // التحقق من صحة كل منتج
                const validProducts = [];
                for (let p of productsArray) {
                    if (p.name && typeof p.name === 'string' && typeof p.price === 'number' && !isNaN(p.price) && typeof p.stock === 'number' && !isNaN(p.stock)) {
                        // تعيين قيم افتراضية للحقول المفقودة
                        const newProduct = {
                            id: p.id || Date.now() + Math.random(),
                            name: p.name,
                            price: p.price,
                            stock: p.stock,
                            image: p.image || "📦",
                            category: p.category || "عام",
                            salesCount: p.salesCount || 0
                        };
                        validProducts.push(newProduct);
                    } else {
                        console.warn("منتج غير صالح:", p);
                    }
                }
                
                if (validProducts.length === 0) throw new Error("لا توجد منتجات صالحة في الملف");
                
                if (mergeMode === "replace") {
                    storeData.products = validProducts;
                    addLog("import_products", `استبدال جميع المنتجات بـ ${validProducts.length} منتج من JSON`);
                } else { // دمج
                    const existingIds = new Set(storeData.products.map(p => p.id));
                    for (let newProd of validProducts) {
                        if (!existingIds.has(newProd.id)) {
                            storeData.products.push(newProd);
                        } else {
                            // إذا وجد نفس المعرف نقوم بتحديث المنتج الموجود (اختياري)
                            const index = storeData.products.findIndex(p => p.id === newProd.id);
                            if (index !== -1) {
                                storeData.products[index] = { ...storeData.products[index], ...newProd };
                            } else {
                                storeData.products.push(newProd);
                            }
                        }
                    }
                    addLog("import_products", `دمج ${validProducts.length} منتج من JSON مع المنتجات الحالية`);
                }
                saveStoreData();
                renderPage(); // تحديث الواجهة
                showToast(`تم استيراد ${validProducts.length} منتج بنجاح`, "success");
            } catch(err) {

    function showProductModal(productId = null) {
        const product = productId ? storeData.products.find(p => p.id === productId) : null;
        const modal = document.createElement("div"); modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><h3>${product ? "تعديل منتج" : "إضافة منتج"}</h3>
            <input type="text" id="prodName" placeholder="الاسم" value="${product?.name || ''}" style="width:100%; margin:10px 0; padding:10px;">
            <input type="number" id="prodPrice" placeholder="السعر" value="${product?.price || ''}" style="width:100%; margin:10px 0; padding:10px;">
            <input type="number" id="prodStock" placeholder="المخزون" value="${product?.stock || ''}" style="width:100%; margin:10px 0; padding:10px;">
            <input type="text" id="prodCategory" placeholder="التصنيف" value="${product?.category || ''}" style="width:100%; margin:10px 0; padding:10px;">
            <input type="file" id="prodImage" accept="image/*" style="margin:10px 0;">
            <div id="currentImagePreview">${product?.image && product.image.startsWith('data:') ? `<img src="${product.image}" width="60">` : (product?.image || '')}</div>
            <div style="display:flex; gap:10px; margin-top:20px;"><button class="btn btn-primary" id="saveProduct">حفظ</button><button class="btn" id="closeModal">إلغاء</button></div>
        </div>`;
        document.body.appendChild(modal);
        document.getElementById("closeModal").onclick = () => modal.remove();
        document.getElementById("saveProduct").onclick = () => {
            const name = document.getElementById("prodName").value;
            const price = parseFloat(document.getElementById("prodPrice").value);
            const stock = parseInt(document.getElementById("prodStock").value);
            const category = document.getElementById("prodCategory").value;
            const file = document.getElementById("prodImage").files[0];
            if(!name || isNaN(price)) return showToast("بيانات ناقصة", "error");
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveProductLogic(productId, name, price, stock, category, e.target.result);
                    modal.remove();
                };
                reader.readAsDataURL(file);
            } else {
                saveProductLogic(productId, name, price, stock, category, product?.image || "📦");
                modal.remove();
            }
        };
    }
    
    function saveProductLogic(id, name, price, stock, category, image) {
        if(id) {
            const idx = storeData.products.findIndex(p => p.id === id);
            if(idx !== -1) storeData.products[idx] = { ...storeData.products[idx], name, price, stock, category, image };
            addLog("edit_product", `تعديل المنتج ${name}`);
        } else {
            const newId = storeData.products.length ? Math.max(...storeData.products.map(p=>p.id)) + 1 : 100;
            storeData.products.push({ id: newId, name, price, stock, image, category, salesCount: 0 });
            addLog("add_product", `إضافة منتج ${name}`);
        }
        saveStoreData();
        renderPage();
        showToast("تم الحفظ بنجاح");
    }

    function showOrderModal() {
        const modal = document.createElement("div"); modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><h3>طلب جديد</h3>
            <select id="orderProduct" style="width:100%; padding:10px;">${storeData.products.map(p => `<option value="${p.id}">${p.name} - ${p.price} (المتبقي ${p.stock})</option>`).join('')}</select>
            <input type="number" id="orderQty" placeholder="الكمية" value="1" style="width:100%; margin:10px 0; padding:10px;">
            <input type="text" id="orderCustomer" placeholder="اسم العميل" style="width:100%; padding:10px;">
            <input type="text" id="couponCode" placeholder="كود خصم (اختياري)" style="width:100%; margin:10px 0; padding:10px;">
            <div style="display:flex; gap:10px;"><button class="btn btn-primary" id="confirmOrder">إضافة</button><button class="btn" id="closeModal">إلغاء</button></div>
        </div>`;
        document.body.appendChild(modal);
        document.getElementById("closeModal").onclick = () => modal.remove();
        document.getElementById("confirmOrder").onclick = () => {
            const productId = parseInt(document.getElementById("orderProduct").value);
            const qty = parseInt(document.getElementById("orderQty").value);
            const customer = document.getElementById("orderCustomer").value;
            const couponCode = document.getElementById("couponCode").value;
            const product = storeData.products.find(p=>p.id===productId);
            if(!product || qty<1 || !customer) return showToast("بيانات ناقصة");
            if(product.stock < qty) return showToast("مخزون غير كاف");
            let total = product.price * qty;
            let couponDiscount = 0;
            const coupon = storeData.coupons.find(c => c.code === couponCode && c.active && new Date(c.expiry) > new Date());
            if(coupon) { couponDiscount = coupon.type === "percent" ? total * coupon.discount/100 : coupon.discount; total -= couponDiscount; }
            const newId = storeData.orders.length ? Math.max(...storeData.orders.map(o=>o.id)) + 1 : 2000;
            storeData.orders.push({ id: newId, productId, quantity: qty, total, status: "pending", date: new Date().toISOString(), customer, customerId: null, couponCode: couponCode || null });
            product.stock -= qty;
            product.salesCount = (product.salesCount || 0) + qty;
            saveStoreData();
            addLog("new_order", `طلب جديد ${newId} بقيمة ${total}`);
            modal.remove();
            renderPage();
            showToast("تم إضافة الطلب");
        };
    }

            </div>
            <div class="stat-card">
                <h3>📁 النسخ الاحتياطي (JSON)</h3>

                <input type="file" id="importJsonInput" accept=".json" style="display:none;">

                <div style="margin-top:10px; font-size:12px; color:var(--text-secondary);">استخدم JSON لمزامنة البيانات بين الأجهزة أو للنسخ الاحتياطي.</div>
            </div>`;
        document.getElementById("saveSettings")?.addEventListener("click", () => { storeData.settings.storeName = document.getElementById("storeName").value; storeData.settings.currency = document.getElementById("currency").value; storeData.settings.language = document.getElementById("lang").value; saveStoreData(); applySettings(); showToast("تم حفظ الإعدادات"); renderPage(); });
        document.getElementById("resetData")?.addEventListener("click", () => { if(confirm("سيتم مسح كل البيانات نهائياً!")) { localStorage.clear(); location.reload(); } });
        
        // تصدير JSON كامل
        document.getElementById("exportJsonBtn")?.addEventListener("click", () => {
            const dataStr = JSON.stringify(storeData, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `store_backup_${new Date().toISOString().slice(0,19)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("تم تصدير البيانات بنجاح");
            addLog("export_json", "تصدير بيانات المتجر بتنسيق JSON");
        });
        
        // استيراد JSON كامل
        const fileInput = document.getElementById("importJsonInput");
        document.getElementById("importJsonBtn")?.addEventListener("click", () => fileInput.click());
        fileInput?.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if(imported.products && imported.orders && imported.users && imported.settings) {
                        storeData = imported;
                        saveStoreData();
                        addLog("import_json", "استيراد بيانات المتجر من ملف JSON (كامل)");
                        renderPage();
                        showToast("تم استيراد البيانات بنجاح");
                    } else throw new Error("بنية الملف غير صالحة");
                } catch(err) { showToast("خطأ: الملف غير صالح", "error"); }
                fileInput.value = "";
            };
            reader.readAsText(file);
        });
    }

    document.getElementById("mobileMenuToggle")?.addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("themeToggle")?.addEventListener("click", () => { storeData.settings.darkMode = !storeData.settings.darkMode; applySettings(); saveStoreData(); });
    document.getElementById("langToggle")?.addEventListener("click", () => { storeData.settings.language = storeData.settings.language === "ar" ? "en" : "ar"; applySettings(); saveStoreData(); renderPage(); });
    
    document.querySelectorAll(".sidebar-nav a[data-page]").forEach(link => { link.addEventListener("click", (e) => { e.preventDefault(); currentPage = link.dataset.page; renderPage(); if(window.innerWidth<768) document.getElementById("sidebar").classList.remove("open"); }); });
    
    loadStoreData();
    if(currentUser) { renderPage(); document.getElementById("loginContainer").style.display = "none"; document.getElementById("appLayout").style.display = "block"; }
</script>
</body>
</html>
