<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نظام إدارة المتجر المتكامل - النسخة المتطورة (مُصَحَّح)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        /* نفس الأنماط السابقة - لم تتغير */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        :root { --bg-color: #f5f7fb; --card-bg: #ffffff; --text-primary: #1e293b; --text-secondary: #64748b; --border-color: #e2e8f0; --sidebar-bg: #0f172a; --sidebar-text: #e2e8f0; --primary: #6D001A; --primary-light: #9f1239; --accent-blue: #0ea5e9; --accent-pink: #ec4899; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        body.dark { --bg-color: #0f172a; --card-bg: #1e293b; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border-color: #334155; --sidebar-bg: #020617; --sidebar-text: #cbd5e1; }
        body { background: var(--bg-color); color: var(--text-primary); transition: all 0.3s ease; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); position: fixed; width: 100%; z-index: 1000; }
        .login-card { background: var(--card-bg); border-radius: 32px; padding: 40px; width: 90%; max-width: 450px; box-shadow: var(--shadow); animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .app-layout { display: none; }
        .sidebar { position: fixed; right: 0; top: 0; width: 280px; height: 100vh; background: var(--sidebar-bg); color: var(--sidebar-text); transition: all 0.3s; z-index: 100; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.2); }
        .main-content { margin-right: 280px; padding: 20px; min-height: 100vh; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 12px 25px; color: var(--sidebar-text); text-decoration: none; transition: 0.3s; margin: 5px 0; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: var(--primary); color: white; border-radius: 12px; margin: 5px 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .data-table { width: 100%; background: var(--card-bg); border-radius: 16px; overflow-x: auto; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border-color); }
        .btn { padding: 8px 16px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: scale(1.02); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 13px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); border-radius: 28px; padding: 30px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        .toast-notification { position: fixed; bottom: 20px; left: 20px; background: var(--success); color: white; padding: 12px 20px; border-radius: 40px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { .sidebar { right: -280px; } .sidebar.open { right: 0; } .main-content { margin-right: 0; } .menu-toggle { display: block; position: fixed; top: 15px; right: 15px; z-index: 101; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 12px; } }
        .theme-toggle { cursor: pointer; padding: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <div class="logo" style="text-align: center; margin-bottom: 30px;">
            <h1 style="color: var(--primary);">Store <span style="color:#333;">System</span></h1>
            <p>نظام إدارة المتجر المتكامل</p>
        </div>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" style="width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1px solid #ddd;">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" style="width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1px solid #ddd;">
        <div id="loginError" style="color:red; display:none; margin:10px 0;">بيانات غير صحيحة</div>
        <button class="btn btn-primary" style="width:100%; padding:14px;" id="doLogin">دخول</button>
    </div>
</div>

<div class="app-layout" id="appLayout">
    <button class="menu-toggle" id="mobileMenuToggle"><i class="bi bi-list"></i></button>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Store <span style="color:var(--primary);">System</span></h2>
            <div style="margin-top:15px; display:flex; justify-content:center; gap:10px;">
                <div class="theme-toggle" id="themeToggle"><i class="bi bi-moon-stars"></i></div>
                <div class="theme-toggle" id="langToggle"><i class="bi bi-translate"></i></div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a data-page="dashboard"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
            <a data-page="products"><i class="bi bi-box-seam"></i> المنتجات</a>
            <a data-page="orders"><i class="bi bi-cart-check"></i> الطلبات</a>
            <a data-page="customers"><i class="bi bi-people"></i> العملاء</a>
            <a data-page="suppliers"><i class="bi bi-truck"></i> الموردين</a>
            <a data-page="coupons"><i class="bi bi-ticket-perforated"></i> الكوبونات</a>
            <a data-page="analytics"><i class="bi bi-graph-up"></i> التحليلات</a>
            <a data-page="logs"><i class="bi bi-journal-text"></i> سجل العمليات</a>
            <a data-page="settings"><i class="bi bi-gear"></i> الإعدادات</a>
            <a id="logoutBtn" style="margin-top:30px; color:#f87171;"><i class="bi bi-box-arrow-right"></i> خروج</a>
        </nav>
    </aside>
    <main class="main-content" id="mainContent"></main>
</div>

<script>
    // === كود التزامن بين نظام الإدارة ومتجر الألعاب === (تم الاحتفاظ به دون تغيير جوهري)
    (function syncStoreAndGame() {
        const ADMIN_KEY = 'advanced_store_data';
        const GAME_PRODUCTS_KEY = 'games_store_products';
        const GAME_ORDERS_KEY = 'games_store_orders';
        function syncProductsFromAdmin() {
            const adminData = localStorage.getItem(ADMIN_KEY);
            if (adminData) {
                const parsed = JSON.parse(adminData);
                if (parsed.products && Array.isArray(parsed.products)) {
                    const gameProducts = parsed.products.map(p => ({
                        id: p.id, name: p.name, category: p.category || 'ألعاب', price: p.price,
                        image: p.image?.startsWith('data:') ? p.image : (p.image || 'https://via.placeholder.com/400'),
                        premium: p.price > 2000
                    }));
                    localStorage.setItem(GAME_PRODUCTS_KEY, JSON.stringify(gameProducts));
                }
            }
        }
        function syncOrdersToAdmin() {
            const gameOrders = localStorage.getItem(GAME_ORDERS_KEY);
            const adminData = localStorage.getItem(ADMIN_KEY);
            if (gameOrders && adminData) {
                const ordersGame = JSON.parse(gameOrders);
                const admin = JSON.parse(adminData);
                if (!admin.orders) admin.orders = [];
                let updated = false;
                ordersGame.forEach(order => {
                    const exists = admin.orders.some(o => o.id === order.id);
                    if (!exists) {
                        admin.orders.push({
                            id: order.id, productId: order.items?.[0]?.id || 0,
                            quantity: order.items?.reduce((s, i) => s + i.quantity, 0) || 1,
                            total: order.total, status: order.status === 'قيد الانتظار' ? 'pending' : 'completed',
                            date: order.createdAt || new Date().toISOString(), customer: 'عميل المتجر', customerId: null, couponCode: null
                        });
                        updated = true;
                    }
                });
                if (updated) { localStorage.setItem(ADMIN_KEY, JSON.stringify(admin)); window.dispatchEvent(new StorageEvent('storage', { key: ADMIN_KEY, newValue: JSON.stringify(admin) })); }
            }
        }
        window.addEventListener('storage', (e) => { if (e.key === ADMIN_KEY && e.newValue) syncProductsFromAdmin(); if (e.key === GAME_ORDERS_KEY && e.newValue) syncOrdersToAdmin(); });
        syncProductsFromAdmin(); syncOrdersToAdmin();
        setInterval(() => { syncProductsFromAdmin(); syncOrdersToAdmin(); }, 5000);
    })();

    // ------------------- البيانات الأساسية -------------------
    let storeData = { products: [], orders: [], users: [], suppliers: [], coupons: [], logs: [], customers: [], settings: { storeName: "متجر المتكامل", currency: "$", darkMode: false, language: "ar" } };
    let currentUser = null;
    let currentPage = "dashboard";
    let charts = {};

    function loadStoreData() {
        const saved = localStorage.getItem("advanced_store_data");
        if (saved) {
            storeData = JSON.parse(saved);
        } else {
            storeData.products = [
                { id: 1, name: "هاتف ذكي", price: 1200, stock: 15, image: "📱", category: "الكترونيات", salesCount: 12 },
                { id: 2, name: "حاسوب محمول", price: 4500, stock: 7, image: "💻", category: "الكترونيات", salesCount: 5 },
                { id: 3, name: "سماعات", price: 250, stock: 30, image: "🎧", category: "اكسسوارات", salesCount: 20 }
            ];
            storeData.orders = [
                { id: 1001, productId: 1, quantity: 2, total: 2400, status: "completed", date: new Date().toISOString(), customer: "أحمد علي", customerId: 1, couponCode: null },
                { id: 1002, productId: 2, quantity: 1, total: 4500, status: "pending", date: new Date().toISOString(), customer: "سارة محمود", customerId: 2, couponCode: null }
            ];
            storeData.users = [
                { id: 1, name: "مدير النظام", email: "mazin0968852427@gmail.com", password: btoa("panda@2025"), role: "admin" },
                { id: 2, name: "موظف المبيعات", email: "staff@store.com", password: btoa("staff123"), role: "staff" },
                { id: 3, name: "مشاهد", email: "viewer@store.com", password: btoa("view123"), role: "viewer" }
            ];
            storeData.suppliers = [ { id: 1, name: "شركة التقنية", contact: "tech@mail.com", phone: "0500000000", products: [1,2] } ];
            storeData.coupons = [ { code: "SAVE10", discount: 10, type: "percent", expiry: "2025-12-31", active: true } ];
            storeData.logs = [];
            storeData.customers = [
                { id: 1, name: "أحمد علي", email: "ahmed@example.com", phone: "0912345678", createdAt: new Date().toISOString() },
                { id: 2, name: "سارة محمود", email: "sara@example.com", phone: "0923456789", createdAt: new Date().toISOString() }
            ];
            storeData.orders.forEach(order => { if (order.customer === "أحمد علي" && !order.customerId) order.customerId = 1; if (order.customer === "سارة محمود" && !order.customerId) order.customerId = 2; });
            addLog("system", "تم تهيئة النظام");
            saveStoreData();
        }
        if (!storeData.customers) storeData.customers = [];
        applySettings();
    }
    function saveStoreData() { localStorage.setItem("advanced_store_data", JSON.stringify(storeData)); window.dispatchEvent(new StorageEvent('storage', { key: 'advanced_store_data', newValue: JSON.stringify(storeData) })); }
    function addLog(action, details) { storeData.logs.unshift({ id: Date.now(), user: currentUser?.name || "system", action, details, time: new Date().toISOString() }); if(storeData.logs.length > 200) storeData.logs.pop(); saveStoreData(); }
    function applySettings() { if(storeData.settings.darkMode) document.body.classList.add("dark"); else document.body.classList.remove("dark"); document.dir = storeData.settings.language === "ar" ? "rtl" : "ltr"; document.documentElement.lang = storeData.settings.language; }
    function hasPermission(action) { if(!currentUser) return false; if(currentUser.role === "admin") return true; if(currentUser.role === "staff") return ["products", "orders", "dashboard", "customers"].includes(action); if(currentUser.role === "viewer") return action === "dashboard"; return false; }
    function showToast(msg, type="success") { const toast = document.createElement("div"); toast.className = "toast-notification"; toast.innerHTML = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000); }

    async function renderPage() {
        if(!hasPermission(currentPage) && currentPage !== "dashboard") { showToast("ليس لديك صلاحية", "error"); currentPage = "dashboard"; }
        const container = document.getElementById("mainContent");
        if(currentPage === "dashboard") await renderDashboard(container);
        else if(currentPage === "products") renderProducts(container);
        else if(currentPage === "orders") renderOrders(container);
        else if(currentPage === "customers") renderCustomers(container);
        else if(currentPage === "suppliers") renderSuppliers(container);
        else if(currentPage === "coupons") renderCoupons(container);
        else if(currentPage === "analytics") renderAnalytics(container);
        else if(currentPage === "logs") renderLogs(container);
        else if(currentPage === "settings") renderSettings(container);
        document.querySelectorAll(".sidebar-nav a").forEach(link => { if(link.dataset.page === currentPage) link.classList.add("active"); else link.classList.remove("active"); });
    }

    async function renderDashboard(container) {
        const completedOrders = storeData.orders.filter(o => o.status === "completed");
        const totalRevenue = completedOrders.reduce((s,o) => s + o.total, 0);
        const totalOrders = storeData.orders.length;
        const pendingOrders = storeData.orders.filter(o => o.status === "pending").length;
        const lowStock = storeData.products.filter(p => p.stock < 5).length;
        const topProducts = [...storeData.products].sort((a,b) => b.salesCount - a.salesCount).slice(0,5);
        container.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;"><h1><i class="bi bi-house-door"></i> لوحة التحكم</h1><div>${new Date().toLocaleDateString('ar-EG')}</div></div>
            <div class="stats-grid"><div class="stat-card"><div><div class="stat-label">إجمالي المبيعات</div><div class="stat-value" style="font-size:28px; font-weight:bold;">${storeData.settings.currency}${totalRevenue}</div></div><i class="bi bi-cash-stack" style="font-size:32px; color:var(--accent-blue);"></i></div>
            <div class="stat-card"><div><div class="stat-label">الطلبات</div><div class="stat-value">${totalOrders}</div></div><i class="bi bi-cart" style="font-size:32px; color:var(--accent-pink);"></i></div>
            <div class="stat-card"><div><div class="stat-label">معلق</div><div class="stat-value">${pendingOrders}</div></div><i class="bi bi-clock" style="font-size:32px; color:var(--warning);"></i></div>
            <div class="stat-card"><div><div class="stat-label">منتجات منخفضة المخزون</div><div class="stat-value">${lowStock}</div></div><i class="bi bi-exclamation-triangle" style="font-size:32px; color:var(--danger);"></i></div></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;"><div class="stat-card" style="padding:20px;"><canvas id="salesChart"></canvas></div><div class="stat-card"><h3>🏆 أفضل المنتجات</h3><ul>${topProducts.map(p => `<li>${p.name} - ${p.salesCount} مبيعات</li>`).join('')}</ul></div></div>
            <div class="stat-card" style="margin-top:20px;"><h3>📋 آخر الطلبات</h3><table class="data-table"><thead><table><th>#</th><th>العميل</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${storeData.orders.slice(0,5).map(o => `<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.total}</td><td>${o.status === "completed" ? "مكتمل" : "معلق"}</td></tr>`).join('')}</tbody></table></div>`;
        const monthly = {}; storeData.orders.forEach(o => { const month = new Date(o.date).getMonth(); monthly[month] = (monthly[month] || 0) + o.total; });
        const ctx = document.getElementById('salesChart')?.getContext('2d');
        if(ctx) { if(charts.salesChart) charts.salesChart.destroy(); charts.salesChart = new Chart(ctx, { type: 'line', data: { labels: Object.keys(monthly).map(m => `شهر ${parseInt(m)+1}`), datasets: [{ label: 'المبيعات', data: Object.values(monthly), borderColor: '#6D001A', tension: 0.3 }] } }); }
    }

    // ========== المنتجات مع منع حذف المرتبط بطلبات ==========
    function renderProducts(container) {
        if(!hasPermission("products")) { container.innerHTML = "<div class='stat-card'>غير مصرح</div>"; return; }
        const renderTable = () => {
            container.innerHTML = `<div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px;"><h2>المنتجات</h2><div style="display:flex; gap:10px;"><button class="btn btn-primary" id="addProductBtn">+ منتج جديد</button><button class="btn btn-primary" id="importProductsBtn"><i class="bi bi-upload"></i> استيراد منتجات JSON</button></div></div>
                <table class="data-table"><thead><tr><th>الصورة</th><th>الاسم</th><th>السعر</th><th>المخزون</th><th>المبيعات</th><th>إجراءات</th></tr></thead><tbody>${storeData.products.map(p => `<tr><td>${p.image && p.image.startsWith('data:') ? `<img src="${p.image}" width="40" height="40" style="border-radius:8px;">` : p.image || '📦'}</td><td>${p.name}</td><td>${storeData.settings.currency}${p.price}</td><td>${p.stock}</td><td>${p.salesCount || 0}</td><td><button class="btn btn-sm btn-primary editProduct" data-id="${p.id}">تعديل</button> <button class="btn btn-sm btn-danger deleteProduct" data-id="${p.id}">حذف</button></td></tr>`).join('')}</tbody></table>
                <div style="margin-top:15px; font-size:12px; color:var(--text-secondary);"><i class="bi bi-info-circle"></i> يمكنك استيراد ملف JSON يحتوي على مصفوفة منتجات أو كائن بمفتاح "products". <a href="#" id="downloadSampleJson" style="color:var(--accent-blue);">تحميل ملف نموذجي</a></div>`;
            document.getElementById("addProductBtn")?.addEventListener("click", () => showProductModal());
            document.querySelectorAll(".editProduct").forEach(btn => btn.addEventListener("click", () => showProductModal(parseInt(btn.dataset.id))));
            document.querySelectorAll(".deleteProduct").forEach(btn => btn.addEventListener("click", () => {
                if (confirm("حذف المنتج؟")) {
                    const id = parseInt(btn.dataset.id);
                    const hasOrders = storeData.orders.some(o => o.productId === id);
                    if (hasOrders) { showToast("لا يمكن حذف منتج لديه طلبات مسجلة", "error"); return; }
                    storeData.products = storeData.products.filter(p => p.id !== id);
                    saveStoreData(); addLog("delete_product", `تم حذف منتج`); renderProducts(container);
                }
            }));
            document.getElementById("importProductsBtn")?.addEventListener("click", () => {
                const modal = document.createElement("div"); modal.className = "modal";
                modal.innerHTML = `<div class="modal-content"><h3>استيراد منتجات من JSON</h3><p style="margin:10px 0;">اختر ملف JSON يحتوي على قائمة المنتجات.</p><input type="file" id="importProductsFile" accept=".json" style="width:100%; margin:10px 0;"><div style="margin:15px 0;"><label><input type="radio" name="importMode" value="merge" checked> دمج مع المنتجات الحالية</label><br><label><input type="radio" name="importMode" value="replace"> استبدال جميع المنتجات</label></div><div style="display:flex; gap:10px; margin-top:10px;"><button class="btn btn-primary" id="confirmImportProducts">استيراد</button><button class="btn" id="closeImportModal">إلغاء</button></div></div>`;
                document.body.appendChild(modal);
                const fileInput = modal.querySelector("#importProductsFile");
                const confirmBtn = modal.querySelector("#confirmImportProducts");
                const closeBtn = modal.querySelector("#closeImportModal");
                closeBtn.onclick = () => modal.remove();
                confirmBtn.onclick = () => { const file = fileInput.files[0]; if(!file) { showToast("الرجاء اختيار ملف JSON", "error"); return; } const mode = modal.querySelector("input[name='importMode']:checked").value; importProductsFromJSON(file, mode); modal.remove(); };
            });
            document.getElementById("downloadSampleJson")?.addEventListener("click", (e) => { e.preventDefault(); const sampleProducts = [{ id: 101, name: "منتج نموذجي 1", price: 99, stock: 50, image: "📦", category: "عينة", salesCount: 0 }]; const blob = new Blob([JSON.stringify(sampleProducts, null, 2)], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sample_products.json"; a.click(); URL.revokeObjectURL(blob); showToast("تم تحميل الملف النموذجي"); });
        };
        renderTable();
    }
    function importProductsFromJSON(file, mergeMode) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                let imported = JSON.parse(ev.target.result);
                let productsArray = Array.isArray(imported) ? imported : (imported.products && Array.isArray(imported.products) ? imported.products : []);
                if (!productsArray.length) throw new Error("الملف يجب أن يحتوي على مصفوفة منتجات");
                const sanitize = (str) => str?.replace(/[<>]/g, '') || '';
                const validProducts = [];
                for (let p of productsArray) {
                    if (p.name && typeof p.price === 'number' && !isNaN(p.price) && typeof p.stock === 'number' && !isNaN(p.stock)) {
                        validProducts.push({ id: p.id || Date.now() + Math.random(), name: sanitize(p.name), price: p.price, stock: p.stock, image: p.image || "📦", category: sanitize(p.category) || "عام", salesCount: p.salesCount || 0 });
                    }
                }
                if (validProducts.length === 0) throw new Error("لا توجد منتجات صالحة");
                if (mergeMode === "replace") storeData.products = validProducts;
                else { for (let newProd of validProducts) { const idx = storeData.products.findIndex(p => p.id === newProd.id); if (idx !== -1) storeData.products[idx] = { ...storeData.products[idx], ...newProd }; else storeData.products.push(newProd); } }
                saveStoreData(); renderPage(); showToast(`تم استيراد ${validProducts.length} منتج`);
            } catch(err) { showToast("خطأ: " + err.message, "error"); }
        };
        reader.readAsText(file);
    }
    function showProductModal(productId = null) {
        const product = productId ? storeData.products.find(p => p.id === productId) : null;
        const modal = document.createElement("div"); modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><h3>${product ? "تعديل منتج" : "إضافة منتج"}</h3><input type="text" id="prodName" placeholder="الاسم" value="${product?.name || ''}" style="width:100%; margin:10px 0; padding:10px;"><input type="number" id="prodPrice" placeholder="السعر" value="${product?.price || ''}" style="width:100%; margin:10px 0; padding:10px;"><input type="number" id="prodStock" placeholder="المخزون" value="${product?.stock || ''}" style="width:100%; margin:10px 0; padding:10px;"><input type="text" id="prodCategory" placeholder="التصنيف" value="${product?.category || ''}" style="width:100%; margin:10px 0; padding:10px;"><input type="file" id="prodImage" accept="image/*" style="margin:10px 0;"><div id="currentImagePreview">${product?.image && product.image.startsWith('data:') ? `<img src="${product.image}" width="60">` : (product?.image || '')}</div><div style="display:flex; gap:10px; margin-top:20px;"><button class="btn btn-primary" id="saveProduct">حفظ</button><button class="btn" id="closeModal">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById("closeModal").onclick = () => modal.remove();
        document.getElementById("saveProduct").onclick = () => {
            const name = document.getElementById("prodName").value.trim();
            const price = parseFloat(document.getElementById("prodPrice").value);
            const stock = parseInt(document.getElementById("prodStock").value);
            const category = document.getElementById("prodCategory").value.trim();
            const file = document.getElementById("prodImage").files[0];
            if(!name || isNaN(price)) return showToast("بيانات ناقصة", "error");
            const save = (imageData) => {
                if(productId) { const idx = storeData.products.findIndex(p => p.id === productId); if(idx !== -1) storeData.products[idx] = { ...storeData.products[idx], name, price, stock, category, image: imageData }; addLog("edit_product", `تعديل المنتج ${name}`); }
                else { const newId = storeData.products.length ? Math.max(...storeData.products.map(p=>p.id)) + 1 : 100; storeData.products.push({ id: newId, name, price, stock, image: imageData, category, salesCount: 0 }); addLog("add_product", `إضافة منتج ${name}`); }
                saveStoreData(); renderPage(); showToast("تم الحفظ بنجاح");
            };
            if(file) { const reader = new FileReader(); reader.onload = e => { save(e.target.result); modal.remove(); }; reader.readAsDataURL(file); } else { save(product?.image || "📦"); modal.remove(); }
        };
    }

    // ========== الطلبات مع تحديث salesCount عند تغيير الحالة أو الحذف ==========
    function renderOrders(container) {
        if(!hasPermission("orders")) { container.innerHTML = "<div class='stat-card'>غير مصرح</div>"; return; }
        container.innerHTML = `<div style="display:flex; justify-content:space-between;"><h2>الطلبات</h2><button class="btn btn-primary" id="newOrderBtn">طلب جديد</button></div>
            <table class="data-table"><thead><tr><th>#</th><th>المنتج</th><th>الكمية</th><th>الإجمالي</th><th>الحالة</th><th>العميل</th><th></th></tr></thead><tbody>${storeData.orders.map(o => { const prod = storeData.products.find(p=>p.id===o.productId); return `<tr><td>${o.id}</td><td>${prod?.name || '---'}</td><td>${o.quantity}</td><td>${o.total}</td><td><span class="status-${o.status}">${o.status === "completed" ? "مكتمل" : "معلق"}</span></td><td>${o.customer}</td><td><button class="btn btn-sm toggleStatus" data-id="${o.id}">تغيير الحالة</button> <button class="btn btn-sm btn-danger deleteOrder" data-id="${o.id}">حذف</button></td></tr>`; }).join('')}</tbody></table>`;
        document.getElementById("newOrderBtn")?.addEventListener("click", showOrderModal);
        document.querySelectorAll(".toggleStatus").forEach(btn => btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.id);
            const order = storeData.orders.find(o=>o.id===id);
            if(order) {
                const oldStatus = order.status;
                order.status = order.status === "completed" ? "pending" : "completed";
                const product = storeData.products.find(p => p.id === order.productId);
                if(product) {
                    if (order.status === "completed" && oldStatus !== "completed") product.salesCount = (product.salesCount || 0) + order.quantity;
                    else if (order.status !== "completed" && oldStatus === "completed") product.salesCount = Math.max(0, (product.salesCount || 0) - order.quantity);
                }
                saveStoreData(); renderOrders(container); addLog("update_status", `تحديث حالة الطلب ${id}`); showToast("تم التحديث");
            }
        }));
        document.querySelectorAll(".deleteOrder").forEach(btn => btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.id);
            const orderToDelete = storeData.orders.find(o => o.id === id);
            if (orderToDelete && orderToDelete.status === "completed") {
                const product = storeData.products.find(p => p.id === orderToDelete.productId);
                if (product) product.salesCount = Math.max(0, (product.salesCount || 0) - orderToDelete.quantity);
            }
            storeData.orders = storeData.orders.filter(o=>o.id !== id);
            saveStoreData(); renderOrders(container); addLog("delete_order", "حذف طلب");
        }));
    }
    function showOrderModal() {
        const modal = document.createElement("div"); modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><h3>طلب جديد</h3>
            <select id="orderProduct" style="width:100%; padding:10px;">${storeData.products.map(p => `<option value="${p.id}">${p.name} - ${p.price} (المتبقي ${p.stock})</option>`).join('')}</select>
            <input type="number" id="orderQty" placeholder="الكمية" value="1" style="width:100%; margin:10px 0; padding:10px;">
            <input type="text" id="orderCustomer" placeholder="اسم العميل" style="width:100%; padding:10px;">
            <input type="text" id="couponCode" placeholder="كود خصم (اختياري)" style="width:100%; margin:10px 0; padding:10px;">
            <div style="display:flex; gap:10px;"><button class="btn btn-primary" id="confirmOrder">إضافة</button><button class="btn" id="closeModal">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById("closeModal").onclick = () => modal.remove();
        document.getElementById("confirmOrder").onclick = () => {
            const productId = parseInt(document.getElementById("orderProduct").value);
            const qty = parseInt(document.getElementById("orderQty").value);
            const customer = document.getElementById("orderCustomer").value.trim();
            const couponCode = document.getElementById("couponCode").value;
            const product = storeData.products.find(p=>p.id===productId);
            if(!product || qty<1 || !customer) return showToast("بيانات ناقصة");
            if(product.stock < qty) return showToast("مخزون غير كاف");
            let total = product.price * qty;
            const coupon = storeData.coupons.find(c => c.code === couponCode && c.active && new Date(c.expiry) > new Date());
            if(coupon) total -= coupon.type === "percent" ? total * coupon.discount/100 : coupon.discount;
            // معالجة العميل: بحث أو إضافة
            let customerId = null;
            let existing = storeData.customers.find(c => c.name === customer);
            if (existing) customerId = existing.id;
            else { const newId = storeData.customers.length ? Math.max(...storeData.customers.map(c=>c.id)) + 1 : 100; storeData.customers.push({ id: newId, name: customer, email: "", phone: "", createdAt: new Date().toISOString() }); customerId = newId; addLog("add_customer", `إضافة عميل تلقائي: ${customer}`); }
            const newId = storeData.orders.length ? Math.max(...storeData.orders.map(o=>o.id)) + 1 : 2000;
            storeData.orders.push({ id: newId, productId, quantity: qty, total, status: "pending", date: new Date().toISOString(), customer, customerId, couponCode: couponCode || null });
            product.stock -= qty;
            // salesCount يزيد فقط عند اكتمال الطلب، لكن هنا الطلب pending فننتظر التغيير لاحقاً
            saveStoreData(); addLog("new_order", `طلب جديد ${newId} بقيمة ${total}`); modal.remove(); renderPage(); showToast("تم إضافة الطلب");
        };
    }

    // ========== العملاء مع CRUD ==========
    function renderCustomers(container) {
        if (!hasPermission("customers")) { container.innerHTML = "<div class='stat-card'>غير مصرح</div>"; return; }
        if (!storeData.customers) storeData.customers = [];
        const customersList = storeData.customers;
        container.innerHTML = `<div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px;"><h2>العملاء</h2><button class="btn btn-primary" id="addCustomerBtn"><i class="bi bi-person-plus"></i> عميل جديد</button></div>
            <table class="data-table"><thead><tr><th>#</th><th>الاسم</th><th>البريد الإلكتروني</th><th>الهاتف</th><th>الطلبات</th><th>إجمالي المشتريات</th><th>إجراءات</th></tr></thead><tbody>${customersList.map(c => { const customerOrders = storeData.orders.filter(o => o.customerId === c.id); const ordersCount = customerOrders.length; const totalSpent = customerOrders.reduce((sum, o) => sum + (o.status === 'completed' ? o.total : 0), 0); return `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.email || '—'}</td><td>${c.phone || '—'}</td><td>${ordersCount}</td><td>${storeData.settings.currency}${totalSpent.toLocaleString()}</td><td><button class="btn btn-sm btn-primary editCustomer" data-id="${c.id}"><i class="bi bi-pencil"></i> تعديل</button> <button class="btn btn-sm btn-danger deleteCustomer" data-id="${c.id}"><i class="bi bi-trash"></i> حذف</button></td></tr>`; }).join('')}${customersList.length === 0 ? '<tr><td colspan="7" style="text-align:center;">لا يوجد عملاء. أضف عميلاً جديداً</td></tr>' : ''}</tbody></table>`;
        document.getElementById("addCustomerBtn")?.addEventListener("click", () => showCustomerModal());
        document.querySelectorAll(".editCustomer").forEach(btn => btn.addEventListener("click", () => showCustomerModal(parseInt(btn.dataset.id))));
        document.querySelectorAll(".deleteCustomer").forEach(btn => btn.addEventListener("click", () => { if (confirm("هل أنت متأكد من حذف هذا العميل؟")) { const id = parseInt(btn.dataset.id); const hasOrders = storeData.orders.some(o => o.customerId === id); if (hasOrders) { showToast("لا يمكن حذف عميل لديه طلبات مسجلة", "error"); return; } storeData.customers = storeData.customers.filter(c => c.id !== id); saveStoreData(); addLog("delete_customer", `حذف العميل رقم ${id}`); renderCustomers(container); } }));
    }
    function showCustomerModal(customerId = null) {
        const customer = customerId ? storeData.customers.find(c => c.id === customerId) : null;
        const modal = document.createElement("div"); modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><h3>${customer ? "تعديل عميل" : "إضافة عميل جديد"}</h3><input type="text" id="customerName" placeholder="الاسم الكامل" value="${customer?.name || ''}" style="width:100%; margin:10px 0; padding:10px;"><input type="email" id="customerEmail" placeholder="البريد الإلكتروني (اختياري)" value="${customer?.email || ''}" style="width:100%; margin:10px 0; padding:10px;"><input type="tel" id="customerPhone" placeholder="رقم الهاتف (اختياري)" value="${customer?.phone || ''}" style="width:100%; margin:10px 0; padding:10px;"><div style="display:flex; gap:10px; margin-top:20px;"><button class="btn btn-primary" id="saveCustomerBtn">حفظ</button><button class="btn" id="closeCustomerModal">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById("closeCustomerModal").onclick = () => modal.remove();
        document.getElementById("saveCustomerBtn").onclick = () => {
            const name = document.getElementById("customerName").value.trim();
            const email = document.getElementById("customerEmail").value.trim();
            const phone = document.getElementById("customerPhone").value.trim();
            if (!name) { showToast("الاسم مطلوب", "error"); return; }
            if (customerId) { const index = storeData.customers.findIndex(c => c.id === customerId); if (index !== -1) storeData.customers[index] = { ...storeData.customers[index], name, email, phone }; addLog("edit_customer", `تعديل بيانات العميل ${name}`); }
            else { const newId = storeData.customers.length ? Math.max(...storeData.customers.map(c => c.id)) + 1 : 100; storeData.customers.push({ id: newId, name, email, phone, createdAt: new Date().toISOString() }); addLog("add_customer", `إضافة عميل جديد: ${name}`); }
            saveStoreData(); modal.remove(); renderPage(); showToast("تم حفظ بيانات العميل");
        };
    }

    // بقية الدوال (الموردين، الكوبونات، التحليلات، السجلات، الإعدادات) كما هي دون تغيير جوهري، مع إضافة إعادة تعيين الرسوم البيانية عند المزامنة
    function renderSuppliers(container) { if(!hasPermission("admin")) { container.innerHTML = "<div class='stat-card'>غير مصرح</div>"; return; } container.innerHTML = `<h2>الموردين</h2><button class="btn btn-primary" id="addSupplier">+ مورد</button><table class="data-table"><thead><tr><th>الاسم</th><th>جهة الاتصال</th><th>المنتجات</th><th></th></tr></thead><tbody>${storeData.suppliers.map(s => `<tr><td>${s.name}</td><td>${s.contact}</td><td>${s.products.map(pid=>storeData.products.find(p=>p.id===pid)?.name).join(',')}</td><td><button class="btn btn-sm btn-danger deleteSup" data-id="${s.id}">حذف</button></td></tr>`).join('')}</tbody></table>`; document.getElementById("addSupplier")?.addEventListener("click", () => { const name = prompt("اسم المورد"); if(!name) return; storeData.suppliers.push({ id: Date.now(), name, contact: prompt("البريد"), phone: "", products: [] }); saveStoreData(); renderSuppliers(container); addLog("add_supplier", name); }); document.querySelectorAll(".deleteSup").forEach(btn => btn.addEventListener("click", () => { storeData.suppliers = storeData.suppliers.filter(s=>s.id !== parseInt(btn.dataset.id)); saveStoreData(); renderSuppliers(container); })); }
    function renderCoupons(container) { if(!hasPermission("admin")) { container.innerHTML = "<div class='stat-card'>غير مصرح</div>"; return; } container.innerHTML = `<h2>كوبونات الخصم</h2><button class="btn btn-primary" id="addCoupon">+ كوبون</button><table class="data-table"><thead><tr><th>الكود</th><th>الخصم</th><th>تاريخ الانتهاء</th><th>الحالة</th><th></th></tr></thead><tbody>${storeData.coupons.map(c => `<tr><td>${c.code}</td><td>${c.discount}${c.type==='percent'?'%':c.currency}</td><td>${c.expiry}</td><td>${c.active ? 'نشط' : 'غير نشط'}</td><td><button class="btn btn-sm toggleCoupon" data-code="${c.code}">تبديل</button> <button class="btn btn-sm btn-danger delCoupon" data-code="${c.code}">حذف</button></td></tr>`).join('')}</tbody></table>`; document.getElementById("addCoupon")?.addEventListener("click", () => { const code = prompt("الكود"); if(!code) return; storeData.coupons.push({ code, discount: parseFloat(prompt("الخصم")), type: prompt("نوع (percent/fixed)"), expiry: prompt("تاريخ انتهاء YYYY-MM-DD"), active: true }); saveStoreData(); renderCoupons(container); }); document.querySelectorAll(".toggleCoupon").forEach(btn => btn.addEventListener("click", () => { const c = storeData.coupons.find(c=>c.code===btn.dataset.code); if(c) c.active = !c.active; saveStoreData(); renderCoupons(container); })); document.querySelectorAll(".delCoupon").forEach(btn => btn.addEventListener("click", () => { storeData.coupons = storeData.coupons.filter(c=>c.code!==btn.dataset.code); saveStoreData(); renderCoupons(container); })); }
    function renderAnalytics(container) { container.innerHTML = `<h2>التحليلات المتقدمة</h2><div class="stats-grid"><div class="stat-card"><canvas id="categoryChart"></canvas></div><div class="stat-card"><canvas id="trendChart"></canvas></div></div><div class="stat-card"><button class="btn btn-primary" id="exportExcel">تصدير Excel</button> <button class="btn btn-primary" id="exportPDF">تصدير PDF</button></div>`; const catSales = {}; storeData.orders.forEach(o => { const prod = storeData.products.find(p=>p.id===o.productId); if(prod) catSales[prod.category] = (catSales[prod.category] || 0) + o.total; }); if(charts.categoryChart) charts.categoryChart.destroy(); charts.categoryChart = new Chart(document.getElementById("categoryChart"), { type: 'doughnut', data: { labels: Object.keys(catSales), datasets: [{ data: Object.values(catSales), backgroundColor: ['#6D001A','#0ea5e9','#10b981'] }] } }); const monthlyTrend = {}; storeData.orders.forEach(o => { const m = new Date(o.date).toLocaleString('default', { month: 'short' }); monthlyTrend[m] = (monthlyTrend[m] || 0) + o.total; }); if(charts.trendChart) charts.trendChart.destroy(); charts.trendChart = new Chart(document.getElementById("trendChart"), { type: 'bar', data: { labels: Object.keys(monthlyTrend), datasets: [{ label: 'المبيعات', data: Object.values(monthlyTrend) }] } }); document.getElementById("exportExcel")?.addEventListener("click", () => { const ws = XLSX.utils.json_to_sheet(storeData.orders); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Orders"); XLSX.writeFile(wb, `orders_${Date.now()}.xlsx`); showToast("تم التصدير"); }); document.getElementById("exportPDF")?.addEventListener("click", async () => { const { jsPDF } = window.jspdf; const doc = new jsPDF(); doc.text("تقرير الطلبات", 10, 10); doc.save("report.pdf"); }); }
    function renderLogs(container) { container.innerHTML = `<h2>سجل العمليات</h2><table class="data-table"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr></thead><tbody>${storeData.logs.slice(0,50).map(l => `<tr><td>${new Date(l.time).toLocaleString()}</td><td>${l.user}</td><td>${l.action}</td><td>${l.details}</td></tr>`).join('')}</tbody></table>`; }
    function renderSettings(container) {
        if(!hasPermission("admin")) { container.innerHTML = "<div class='stat-card'>غير مصرح</div>"; return; }
        container.innerHTML = `<h2>الإعدادات</h2><div class="stat-card"><label>اسم المتجر</label><input type="text" id="storeName" value="${storeData.settings.storeName}"><br><br><label>العملة</label><input type="text" id="currency" value="${storeData.settings.currency}"><br><br><label>اللغة</label><select id="lang"><option value="ar" ${storeData.settings.language==='ar'?'selected':''}>عربي</option><option value="en" ${storeData.settings.language==='en'?'selected':''}>English</option></select><br><br><button class="btn btn-primary" id="saveSettings">حفظ الإعدادات</button><button class="btn btn-danger" id="resetData">إعادة ضبط البيانات</button></div><div class="stat-card"><h3>📁 النسخ الاحتياطي (JSON)</h3><button class="btn btn-primary" id="exportJsonBtn"><i class="bi bi-download"></i> تصدير JSON</button><input type="file" id="importJsonInput" accept=".json" style="display:none;"><button class="btn btn-primary" id="importJsonBtn"><i class="bi bi-upload"></i> استيراد JSON (كامل)</button><div style="margin-top:10px; font-size:12px; color:var(--text-secondary);">استخدم JSON لمزامنة البيانات بين الأجهزة أو للنسخ الاحتياطي.</div></div>`;
        document.getElementById("saveSettings")?.addEventListener("click", () => { storeData.settings.storeName = document.getElementById("storeName").value; storeData.settings.currency = document.getElementById("currency").value; storeData.settings.language = document.getElementById("lang").value; saveStoreData(); applySettings(); showToast("تم حفظ الإعدادات"); renderPage(); });
        document.getElementById("resetData")?.addEventListener("click", () => { if(confirm("سيتم مسح كل البيانات نهائياً!")) { localStorage.clear(); location.reload(); } });
        document.getElementById("exportJsonBtn")?.addEventListener("click", () => { const dataStr = JSON.stringify(storeData, null, 2); const blob = new Blob([dataStr], {type: "application/json"}); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = `store_backup_${new Date().toISOString().slice(0,19)}.json`; a.click(); URL.revokeObjectURL(url); showToast("تم تصدير البيانات"); addLog("export_json", "تصدير بيانات المتجر"); });
        const fileInput = document.getElementById("importJsonInput"); document.getElementById("importJsonBtn")?.addEventListener("click", () => fileInput.click()); fileInput?.addEventListener("change", (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const imported = JSON.parse(ev.target.result); if(imported.products && imported.orders && imported.users && imported.settings) { storeData = imported; saveStoreData(); addLog("import_json", "استيراد كامل"); renderPage(); showToast("تم استيراد البيانات"); } else throw new Error("بنية غير صالحة"); } catch(err) { showToast("خطأ: الملف غير صالح", "error"); } fileInput.value = ""; }; reader.readAsText(file); });
    }

    // مزامنة التبويبات مع إعادة تعيين الرسوم البيانية
    function syncDataAcrossTabs(e) {
        if(e.key === "advanced_store_data" && e.newValue) {
            storeData = JSON.parse(e.newValue);
            applySettings();
            if (charts.salesChart) { charts.salesChart.destroy(); charts.salesChart = null; }
            if (charts.categoryChart) { charts.categoryChart.destroy(); charts.categoryChart = null; }
            if (charts.trendChart) { charts.trendChart.destroy(); charts.trendChart = null; }
            renderPage();
            showToast("تم تحديث البيانات من نافذة أخرى", "info");
        }
    }
    window.addEventListener("storage", syncDataAcrossTabs);

    // تسجيل الدخول وباقي الأحداث
    document.getElementById("doLogin").addEventListener("click", () => {
        const email = document.getElementById("loginEmail").value;
        const pass = document.getElementById("loginPassword").value;
        const user = storeData.users.find(u => u.email === email && atob(u.password) === pass);
        if(user) { currentUser = user; document.getElementById("loginContainer").style.display = "none"; document.getElementById("appLayout").style.display = "block"; loadStoreData(); renderPage(); addLog("login", `دخول المستخدم ${user.name}`); } else { document.getElementById("loginError").style.display = "block"; }
    });
    document.getElementById("logoutBtn")?.addEventListener("click", () => { currentUser = null; document.getElementById("loginContainer").style.display = "flex"; document.getElementById("appLayout").style.display = "none"; });
    document.getElementById("mobileMenuToggle")?.addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("themeToggle")?.addEventListener("click", () => { storeData.settings.darkMode = !storeData.settings.darkMode; applySettings(); saveStoreData(); });
    document.getElementById("langToggle")?.addEventListener("click", () => { storeData.settings.language = storeData.settings.language === "ar" ? "en" : "ar"; applySettings(); saveStoreData(); renderPage(); });
    document.querySelectorAll(".sidebar-nav a[data-page]").forEach(link => { link.addEventListener("click", (e) => { e.preventDefault(); currentPage = link.dataset.page; renderPage(); if(window.innerWidth<768) document.getElementById("sidebar").classList.remove("open"); }); });
    loadStoreData();
    if(currentUser) { renderPage(); document.getElementById("loginContainer").style.display = "none"; document.getElementById("appLayout").style.display = "block"; }
</script>
</body>
</html>
