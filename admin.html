<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نظام إدارة المتجر </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        :root {
            --primary: #6D001A;
            --primary-light: #9f1239;
            --primary-dark: #4a000f;
            --secondary: #0ea5e9;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-light: #f5f7fb;
            --bg-white: #ffffff;
            --bg-card: #f9fafb;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --sidebar-bg: #0f172a;
            --sidebar-text: #e2e8f0;
            --sidebar-hover: rgba(255, 255, 255, 0.1);
        }

        body.dark {
            --bg-light: #0f172a;
            --bg-white: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-light: #94a3b8;
            --border-color: #334155;
            --sidebar-bg: #020617;
        }

        body {
            background: var(--bg-light);
            color: var(--text-primary);
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        /* تسجيل الدخول */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        .login-card {
            background: var(--bg-white);
            border-radius: 32px;
            padding: 50px 40px;
            width: 90%;
            max-width: 450px;
            box-shadow: var(--shadow-xl);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-form input {
            width: 100%;
            padding: 14px 16px;
            margin: 12px 0;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-light);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(109, 0, 26, 0.1);
        }

        .login-error {
            color: var(--danger);
            font-size: 13px;
            display: none;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* التخطيط الرئيسي */
        .app-layout {
            display: none;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            overflow-y: auto;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 30px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 25px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 5px 10px;
            border-radius: 12px;
        }

        .sidebar-nav a:hover {
            background: var(--sidebar-hover);
            transform: translateX(-5px);
        }

        .sidebar-nav a.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }

        .main-content {
            margin-right: 280px;
            padding: 30px;
            min-height: 100vh;
        }

        /* البطاقات والإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-white);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* الأزرار */
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }

        /* الجداول */
        .table-container {
            background: var(--bg-white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .table-controls {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-white);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            padding: 16px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table tbody tr:hover {
            background: var(--bg-card);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-completed { background: rgba(16,185,129,0.1); color: var(--success); }
        .status-pending { background: rgba(245,158,11,0.1); color: var(--warning); }

        /* المودال */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--bg-white);
            border-radius: 28px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-light);
        }

        /* الإشعارات */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }

        /* استجابة */
        @media (max-width: 768px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar { right: -280px; }
            .sidebar.open { right: 0; }
            .main-content { margin-right: 0; padding: 20px; }
            .menu-toggle { display: block; position: fixed; top: 15px; right: 15px; z-index: 101; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; }
        }
        .menu-toggle { display: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .badge-primary { background: rgba(109,0,26,0.1); color: var(--primary); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .chart-container { background: var(--bg-white); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-card">
            <div class="login-logo">
                <h1><i class="bi bi-shop"></i> Store System</h1>
                <p>نظام إدارة المتجر المتطور - الإصدار النهائي</p>
            </div>
            <div class="login-form">
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
                <div class="login-error" id="loginError">بيانات دخول غير صحيحة</div>
                <button class="login-button" id="doLogin">دخول</button>
            </div>
            <div class="text-center" style="margin-top:20px; font-size:12px;">
            </div>
        </div>
    </div>

    <div class="app-layout" id="appLayout">
        <button class="menu-toggle" id="mobileMenuToggle"><i class="bi bi-list"></i></button>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="bi bi-shop"></i>Store Admin</h2>
                <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
                    <button class="theme-toggle" id="themeToggle" style="background:transparent; border:none; color:white;"><i class="bi bi-moon-stars"></i></button>
                    <button class="theme-toggle" id="langToggle" style="background:transparent; border:none; color:white;"><i class="bi bi-translate"></i></button>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a data-page="dashboard" class="active"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
                <a data-page="products"><i class="bi bi-box-seam"></i> المنتجات</a>
                <a data-page="orders"><i class="bi bi-cart-check"></i> الطلبات</a>
                <a data-page="customers"><i class="bi bi-people"></i> العملاء</a>
                <a data-page="suppliers"><i class="bi bi-truck"></i> الموردين</a>
                <a data-page="coupons"><i class="bi bi-ticket-perforated"></i> الكوبونات</a>
                <a data-page="analytics"><i class="bi bi-graph-up"></i> التحليلات</a>
                <a data-page="logs"><i class="bi bi-journal-text"></i> السجلات</a>
                <a data-page="settings"><i class="bi bi-gear"></i> الإعدادات</a>
                <div class="sidebar-logout" style="margin-top:40px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);">
                    <a id="logoutBtn" style="cursor:pointer;"><i class="bi bi-box-arrow-right"></i> خروج</a>
                </div>
            </nav>
        </aside>
        <main class="main-content" id="mainContent"></main>
    </div>

    <script>
        // ==================== التطبيق المتطور بالكامل ====================
        class StoreManagerPro {
            constructor() {
                this.storeData = this.loadData();
                this.currentUser = null;
                this.currentPage = "dashboard";
                this.charts = {};
                this.init();
            }

            loadData() {
                const saved = localStorage.getItem("advanced_store_data");
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch(e) { return this.getDefaultData(); }
                }
                return this.getDefaultData();
            }

            getDefaultData() {
                return {
                    products: [
                        { id: 1, name: "هاتف ذكي iPhone 15", price: 1200, stock: 15, image: "📱", category: "الكترونيات", salesCount: 12, description: "هاتف ذكي حديث" },
                        { id: 2, name: "حاسوب محمول MacBook Pro", price: 4500, stock: 7, image: "💻", category: "الكترونيات", salesCount: 5, description: "حاسوب محمول قوي" },
                        { id: 3, name: "سماعات رأس Sony", price: 250, stock: 30, image: "🎧", category: "اكسسوارات", salesCount: 20, description: "سماعات عالية الجودة" },
                        { id: 4, name: "شاشة 4K LG", price: 800, stock: 8, image: "🖥️", category: "الكترونيات", salesCount: 3, description: "شاشة عالية الدقة" },
                        { id: 5, name: "لوحة مفاتيح ميكانيكية", price: 180, stock: 25, image: "⌨️", category: "اكسسوارات", salesCount: 15, description: "لوحة مفاتيح احترافية" }
                    ],
                    orders: [
                        { id: 1001, productId: 1, quantity: 2, total: 2400, status: "completed", date: new Date().toISOString(), customer: "أحمد علي", customerId: 1, couponCode: null },
                        { id: 1002, productId: 2, quantity: 1, total: 4500, status: "pending", date: new Date().toISOString(), customer: "سارة محمود", customerId: 2, couponCode: null },
                        { id: 1003, productId: 3, quantity: 3, total: 750, status: "completed", date: new Date(Date.now()-86400000).toISOString(), customer: "محمد حسن", customerId: 3, couponCode: null }
                    ],
                    users: [
                        { id: 1, name: "مدير النظام", email: "mazin0968852427@gmail.com", password: btoa("panda@2025"), role: "admin" },
                        { id: 2, name: "موظف المبيعات", email: "staff@store.com", password: btoa("staff123"), role: "staff" },
                        { id: 3, name: "مشاهد", email: "viewer@store.com", password: btoa("view123"), role: "viewer" }
                    ],
                    suppliers: [
                        { id: 1, name: "شركة التقنية العالمية", contact: "tech@mail.com", phone: "0500000000", products: [1,2] }
                    ],
                    coupons: [
                        { code: "SAVE10", discount: 10, type: "percent", expiry: "2025-12-31", active: true }
                    ],
                    logs: [],
                    customers: [
                        { id: 1, name: "أحمد علي", email: "ahmed@example.com", phone: "0912345678", createdAt: new Date().toISOString() },
                        { id: 2, name: "سارة محمود", email: "sara@example.com", phone: "0923456789", createdAt: new Date().toISOString() },
                        { id: 3, name: "محمد حسن", email: "mohammed@example.com", phone: "0934567890", createdAt: new Date().toISOString() }
                    ],
                    settings: { storeName: "متجر المتكامل", currency: "$", darkMode: false, language: "ar" }
                };
            }

            saveData() {
                localStorage.setItem("advanced_store_data", JSON.stringify(this.storeData));
                window.dispatchEvent(new StorageEvent('storage', { key: 'advanced_store_data', newValue: JSON.stringify(this.storeData) }));
            }

            addLog(action, details) {
                this.storeData.logs.unshift({ id: Date.now(), user: this.currentUser?.name || "system", action, details, time: new Date().toISOString() });
                if(this.storeData.logs.length > 200) this.storeData.logs.pop();
                this.saveData();
            }

            applySettings() {
                if(this.storeData.settings.darkMode) document.body.classList.add("dark");
                else document.body.classList.remove("dark");
                document.dir = this.storeData.settings.language === "ar" ? "rtl" : "ltr";
                document.documentElement.lang = this.storeData.settings.language;
            }

            hasPermission(action) {
                if(!this.currentUser) return false;
                if(this.currentUser.role === "admin") return true;
                if(this.currentUser.role === "staff") return ["products","orders","dashboard","customers"].includes(action);
                if(this.currentUser.role === "viewer") return action === "dashboard";
                return false;
            }

            showToast(msg, type="success") {
                const toast = document.createElement("div");
                toast.className = `toast-notification toast-${type}`;
                toast.innerHTML = `<i class="bi bi-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            async renderPage() {
                if(!this.hasPermission(this.currentPage) && this.currentPage !== "dashboard") {
                    this.showToast("ليس لديك صلاحية", "error");
                    this.currentPage = "dashboard";
                }
                const container = document.getElementById("mainContent");
                if(this.currentPage === "dashboard") await this.renderDashboard(container);
                else if(this.currentPage === "products") this.renderProducts(container);
                else if(this.currentPage === "orders") this.renderOrders(container);
                else if(this.currentPage === "customers") this.renderCustomers(container);
                else if(this.currentPage === "suppliers") this.renderSuppliers(container);
                else if(this.currentPage === "coupons") this.renderCoupons(container);
                else if(this.currentPage === "analytics") this.renderAnalytics(container);
                else if(this.currentPage === "logs") this.renderLogs(container);
                else if(this.currentPage === "settings") this.renderSettings(container);
                
                document.querySelectorAll(".sidebar-nav a").forEach(link => {
                    if(link.dataset.page === this.currentPage) link.classList.add("active");
                    else link.classList.remove("active");
                });
            }

            async renderDashboard(container) {
                const completed = this.storeData.orders.filter(o=>o.status==="completed");
                const totalRevenue = completed.reduce((s,o)=>s+o.total,0);
                const totalOrders = this.storeData.orders.length;
                const pending = this.storeData.orders.filter(o=>o.status==="pending").length;
                const lowStock = this.storeData.products.filter(p=>p.stock<5).length;
                const topProducts = [...this.storeData.products].sort((a,b)=>b.salesCount-a.salesCount).slice(0,5);
                container.innerHTML = `
                    <div class="page-header"><h1><i class="bi bi-house-door"></i> لوحة التحكم</h1></div>
                    <div class="stats-grid">
                        <div class="stat-card"><div><h3>إجمالي المبيعات</h3><div class="stat-value">${this.storeData.settings.currency}${totalRevenue.toLocaleString()}</div></div><i class="bi bi-cash-stack" style="font-size:40px;"></i></div>
                        <div class="stat-card"><div><h3>إجمالي الطلبات</h3><div class="stat-value">${totalOrders}</div></div><i class="bi bi-cart" style="font-size:40px;"></i></div>
                        <div class="stat-card"><div><h3>الطلبات المعلقة</h3><div class="stat-value">${pending}</div></div><i class="bi bi-clock" style="font-size:40px;"></i></div>
                        <div class="stat-card"><div><h3>منتجات منخفضة المخزون</h3><div class="stat-value">${lowStock}</div></div><i class="bi bi-exclamation-triangle" style="font-size:40px;"></i></div>
                    </div>
                    <div class="grid-2">
                        <div class="chart-container"><h3>المبيعات الشهرية</h3><canvas id="salesChart"></canvas></div>
                        <div class="chart-container"><h3>توزيع الفئات</h3><canvas id="categoryChart"></canvas></div>
                    </div>
                    <div class="grid-2">
                        <div class="chart-container"><h3>أفضل المنتجات</h3><ul>${topProducts.map((p,i)=>`<li>${i+1}. ${p.name} - ${p.salesCount} مبيعات</li>`).join('')}</ul></div>
                        <div class="chart-container"><h3>آخر الطلبات</h3><div class="table-wrapper"><table class="data-table"><thead><tr><th>#</th><th>العميل</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${this.storeData.orders.slice(0,5).map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${this.storeData.settings.currency}${o.total}</td><td><span class="status-badge status-${o.status}">${o.status==="completed"?"مكتمل":"معلق"}</span></td></tr>`).join('')}</tbody></table></div></div>
                    </div>
                `;
                const monthly = {};
                this.storeData.orders.forEach(o=>{ let m = new Date(o.date).getMonth(); monthly[m] = (monthly[m]||0)+o.total; });
                const ctx1 = document.getElementById('salesChart')?.getContext('2d');
                if(ctx1 && typeof Chart !== 'undefined') {
                    if(this.charts.salesChart) this.charts.salesChart.destroy();
                    this.charts.salesChart = new Chart(ctx1, { type:'line', data:{ labels:Object.keys(monthly).map(m=>`شهر ${parseInt(m)+1}`), datasets:[{ label:'المبيعات', data:Object.values(monthly), borderColor:'var(--primary)', fill:true }] } });
                }
                const catSales = {};
                this.storeData.orders.forEach(o=>{ let p=this.storeData.products.find(p=>p.id===o.productId); if(p) catSales[p.category]=(catSales[p.category]||0)+o.total; });
                const ctx2 = document.getElementById('categoryChart')?.getContext('2d');
                if(ctx2 && typeof Chart !== 'undefined') {
                    if(this.charts.categoryChart) this.charts.categoryChart.destroy();
                    this.charts.categoryChart = new Chart(ctx2, { type:'doughnut', data:{ labels:Object.keys(catSales), datasets:[{ data:Object.values(catSales), backgroundColor:['var(--primary)','var(--secondary)','var(--success)'] }] } });
                }
            }

            renderProducts(container) {
                if(!this.hasPermission("products")) { container.innerHTML='<div class="empty-state"><i class="bi bi-lock"></i><h3>غير مصرح</h3></div>'; return; }
                container.innerHTML = `
                    <div class="page-header"><h1>المنتجات</h1><button class="btn btn-primary" id="addProductBtn">+ منتج جديد</button></div>
                    <div class="table-container"><div class="table-controls"><div class="search-box"><i class="bi bi-search"></i><input type="text" id="productSearch" placeholder="بحث..."></div></div>
                    <div class="table-wrapper"><table class="data-table"><thead><tr><th>الصورة</th><th>الاسم</th><th>السعر</th><th>المخزون</th><th>الإجراءات</th></tr></thead><tbody id="productsTableBody">${this.storeData.products.map(p=>`<tr><td>${p.image}</td><td>${p.name}</td><td>${this.storeData.settings.currency}${p.price}</td><td><span class="badge ${p.stock<5?'badge-danger':'badge-primary'}">${p.stock}</span></td><td><button class="btn btn-sm btn-primary editProduct" data-id="${p.id}">تعديل</button> <button class="btn btn-sm btn-danger deleteProduct" data-id="${p.id}">حذف</button></td></tr>`).join('')}</tbody></table></div></div>
                `;
                document.getElementById("addProductBtn")?.addEventListener("click",()=>this.showProductModal());
                document.querySelectorAll(".editProduct").forEach(btn=>btn.addEventListener("click",()=>this.showProductModal(parseInt(btn.dataset.id))));
                document.querySelectorAll(".deleteProduct").forEach(btn=>btn.addEventListener("click",()=>this.deleteProduct(parseInt(btn.dataset.id))));
                document.getElementById("productSearch")?.addEventListener("keyup",()=>{ let s=document.getElementById("productSearch").value.toLowerCase(); document.querySelectorAll("#productsTableBody tr").forEach(r=>{ r.style.display=r.cells[1]?.textContent.toLowerCase().includes(s)?"": "none"; }); });
            }

            showProductModal(id=null) {
                const p = id ? this.storeData.products.find(p=>p.id===id) : null;
                const modal = document.createElement("div"); modal.className="modal";
                modal.innerHTML = `<div class="modal-content"><h3>${p?"تعديل":"إضافة"} منتج</h3><div class="form-group"><label>الاسم</label><input id="prodName" value="${p?.name||''}"></div><div class="form-group"><label>السعر</label><input id="prodPrice" type="number" value="${p?.price||''}"></div><div class="form-group"><label>المخزون</label><input id="prodStock" type="number" value="${p?.stock||''}"></div><div class="modal-footer"><button class="btn btn-secondary" id="closeModal">إلغاء</button><button class="btn btn-primary" id="saveProduct">حفظ</button></div></div>`;
                document.body.appendChild(modal);
                document.getElementById("closeModal").onclick=()=>modal.remove();
                document.getElementById("saveProduct").onclick=()=>{
                    const name=document.getElementById("prodName").value.trim(), price=parseFloat(document.getElementById("prodPrice").value), stock=parseInt(document.getElementById("prodStock").value);
                    if(!name||isNaN(price)||isNaN(stock)){ this.showToast("بيانات غير صحيحة","error"); return; }
                    if(id){
                        let idx=this.storeData.products.findIndex(pr=>pr.id===id);
                        if(idx!==-1) this.storeData.products[idx]={...this.storeData.products[idx], name, price, stock};
                    } else {
                        let newId=Math.max(...this.storeData.products.map(p=>p.id),0)+1;
                        this.storeData.products.push({id:newId, name, price, stock, image:"📦", category:"عام", salesCount:0});
                    }
                    this.saveData(); this.addLog("product_save",name); this.renderPage(); modal.remove(); this.showToast("تم الحفظ");
                };
            }

            deleteProduct(id) {
                if(confirm("حذف المنتج؟")){
                    this.storeData.products=this.storeData.products.filter(p=>p.id!==id);
                    this.saveData(); this.addLog("delete_product",`${id}`); this.renderPage(); this.showToast("تم الحذف");
                }
            }

            renderOrders(container) {
                if(!this.hasPermission("orders")){ container.innerHTML='<div class="empty-state">غير مصرح</div>'; return; }
                container.innerHTML = `<div class="page-header"><h1>الطلبات</h1><button class="btn btn-primary" id="newOrderBtn">+ طلب جديد</button></div><div class="table-container"><div class="table-wrapper"><table class="data-table"><thead><tr><th>#</th><th>المنتج</th><th>الكمية</th><th>الإجمالي</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${this.storeData.orders.map(o=>{ let prod=this.storeData.products.find(p=>p.id===o.productId); return `<tr><td>${o.id}</td><td>${prod?.name}</td><td>${o.quantity}</td><td>${this.storeData.settings.currency}${o.total}</td><td><span class="status-badge status-${o.status}">${o.status==="completed"?"مكتمل":"معلق"}</span></td><td><button class="btn btn-sm btn-primary toggleStatus" data-id="${o.id}">تغيير الحالة</button> <button class="btn btn-sm btn-danger deleteOrder" data-id="${o.id}">حذف</button></td></tr>`}).join('')}</tbody></table></div></div>`;
                document.getElementById("newOrderBtn")?.addEventListener("click",()=>this.showOrderModal());
                document.querySelectorAll(".toggleStatus").forEach(btn=>btn.addEventListener("click",()=>this.toggleOrderStatus(parseInt(btn.dataset.id))));
                document.querySelectorAll(".deleteOrder").forEach(btn=>btn.addEventListener("click",()=>this.deleteOrder(parseInt(btn.dataset.id))));
            }

            toggleOrderStatus(id){
                let order=this.storeData.orders.find(o=>o.id===id);
                if(order){
                    order.status=order.status==="completed"?"pending":"completed";
                    this.saveData(); this.addLog("order_status",`${id} -> ${order.status}`); this.renderPage(); this.showToast("تم تحديث الحالة");
                }
            }
            deleteOrder(id){
                if(confirm("حذف الطلب؟")){ this.storeData.orders=this.storeData.orders.filter(o=>o.id!==id); this.saveData(); this.addLog("delete_order",`${id}`); this.renderPage(); this.showToast("تم الحذف"); }
            }
            showOrderModal(){
                const modal=document.createElement("div"); modal.className="modal";
                modal.innerHTML=`<div class="modal-content"><h3>طلب جديد</h3><div class="form-group"><label>المنتج</label><select id="orderProduct">${this.storeData.products.map(p=>`<option value="${p.id}">${p.name} - ${p.price}</option>`).join('')}</select></div><div class="form-group"><label>الكمية</label><input id="orderQty" type="number" value="1"></div><div class="form-group"><label>العميل</label><input id="orderCustomer" placeholder="اسم العميل"></div><div class="modal-footer"><button id="closeModal">إلغاء</button><button id="confirmOrder">إضافة</button></div></div>`;
                document.body.appendChild(modal);
                document.getElementById("closeModal").onclick=()=>modal.remove();
                document.getElementById("confirmOrder").onclick=()=>{
                    let productId=parseInt(document.getElementById("orderProduct").value);
                    let qty=parseInt(document.getElementById("orderQty").value);
                    let customer=document.getElementById("orderCustomer").value.trim();
                    let product=this.storeData.products.find(p=>p.id===productId);
                    if(!product || qty<1 || !customer){ this.showToast("بيانات ناقصة","error"); return; }
                    if(product.stock<qty){ this.showToast("مخزون غير كاف","error"); return; }
                    let total=product.price*qty;
                    let newId=Math.max(...this.storeData.orders.map(o=>o.id),0)+1;
                    let customerId=null;
                    let existing=this.storeData.customers.find(c=>c.name===customer);
                    if(existing) customerId=existing.id;
                    else { let newCid=Math.max(...this.storeData.customers.map(c=>c.id),0)+1; this.storeData.customers.push({id:newCid, name:customer, email:"", phone:"", createdAt:new Date().toISOString()}); customerId=newCid; }
                    this.storeData.orders.push({id:newId, productId, quantity:qty, total, status:"pending", date:new Date().toISOString(), customer, customerId});
                    product.stock-=qty;
                    this.saveData(); this.addLog("new_order",`${newId}`); modal.remove(); this.renderPage(); this.showToast("تم إضافة الطلب");
                };
            }

            renderCustomers(container){
                if(!this.hasPermission("customers")){ container.innerHTML='<div class="empty-state">غير مصرح</div>'; return; }
                container.innerHTML=`<div class="page-header"><h1>العملاء</h1><button class="btn btn-primary" id="addCustomerBtn">+ عميل جديد</button></div><div class="table-container"><div class="table-wrapper"><table class="data-table"><thead><tr><th>#</th><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الإجراءات</th></tr></thead><tbody>${this.storeData.customers.map(c=>`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.email||'—'}</td><td>${c.phone||'—'}</td><td><button class="btn btn-sm btn-danger deleteCustomer" data-id="${c.id}">حذف</button></td></tr>`).join('')}</tbody></table></div></div>`;
                document.getElementById("addCustomerBtn")?.addEventListener("click",()=>this.showCustomerModal());
                document.querySelectorAll(".deleteCustomer").forEach(btn=>btn.addEventListener("click",()=>this.deleteCustomer(parseInt(btn.dataset.id))));
            }
            showCustomerModal(id=null){
                let c=id?this.storeData.customers.find(c=>c.id===id):null;
                let modal=document.createElement("div"); modal.className="modal";
                modal.innerHTML=`<div class="modal-content"><h3>${c?"تعديل":"إضافة"} عميل</h3><div class="form-group"><label>الاسم</label><input id="custName" value="${c?.name||''}"></div><div class="form-group"><label>البريد</label><input id="custEmail" value="${c?.email||''}"></div><div class="form-group"><label>الهاتف</label><input id="custPhone" value="${c?.phone||''}"></div><div class="modal-footer"><button id="closeModal">إلغاء</button><button id="saveCustomer">حفظ</button></div></div>`;
                document.body.appendChild(modal);
                document.getElementById("closeModal").onclick=()=>modal.remove();
                document.getElementById("saveCustomer").onclick=()=>{
                    let name=document.getElementById("custName").value.trim();
                    if(!name){ this.showToast("الاسم مطلوب","error"); return; }
                    if(id){
                        let idx=this.storeData.customers.findIndex(cust=>cust.id===id);
                        if(idx!==-1) this.storeData.customers[idx]={...this.storeData.customers[idx], name, email:document.getElementById("custEmail").value, phone:document.getElementById("custPhone").value};
                    } else {
                        let newId=Math.max(...this.storeData.customers.map(c=>c.id),0)+1;
                        this.storeData.customers.push({id:newId, name, email:document.getElementById("custEmail").value, phone:document.getElementById("custPhone").value, createdAt:new Date().toISOString()});
                    }
                    this.saveData(); this.addLog("customer_save",name); modal.remove(); this.renderPage(); this.showToast("تم الحفظ");
                };
            }
            deleteCustomer(id){
                if(confirm("حذف العميل؟")){
                    this.storeData.customers=this.storeData.customers.filter(c=>c.id!==id);
                    this.saveData(); this.addLog("delete_customer",`${id}`); this.renderPage(); this.showToast("تم الحذف");
                }
            }

            renderSuppliers(container){
                if(!this.hasPermission("admin")){ container.innerHTML='<div class="empty-state">غير مصرح</div>'; return; }
                container.innerHTML=`<div class="page-header"><h1>الموردين</h1><button class="btn btn-primary" id="addSupplier">+ مورد جديد</button></div><div class="table-container"><div class="table-wrapper"><table class="data-table"><thead><tr><th>الاسم</th><th>جهة الاتصال</th><th>الهاتف</th><th></th></tr></thead><tbody>${this.storeData.suppliers.map(s=>`<tr><td>${s.name}</td><td>${s.contact}</td><td>${s.phone}</td><td><button class="btn btn-sm btn-danger deleteSup" data-id="${s.id}">حذف</button></td></tr>`).join('')}</tbody></table></div></div>`;
                document.getElementById("addSupplier")?.addEventListener("click",()=>{
                    let name=prompt("اسم المورد"); if(!name) return;
                    let contact=prompt("جهة الاتصال");
                    let phone=prompt("الهاتف");
                    this.storeData.suppliers.push({id:Date.now(), name, contact, phone, products:[]});
                    this.saveData(); this.addLog("add_supplier",name); this.renderSuppliers(container); this.showToast("تم الإضافة");
                });
                document.querySelectorAll(".deleteSup").forEach(btn=>btn.addEventListener("click",()=>{ this.storeData.suppliers=this.storeData.suppliers.filter(s=>s.id!==parseInt(btn.dataset.id)); this.saveData(); this.renderSuppliers(container); this.showToast("تم الحذف"); }));
            }

            renderCoupons(container){
                if(!this.hasPermission("admin")){ container.innerHTML='<div class="empty-state">غير مصرح</div>'; return; }
                container.innerHTML=`<div class="page-header"><h1>الكوبونات</h1><button class="btn btn-primary" id="addCoupon">+ كوبون جديد</button></div><div class="table-container"><div class="table-wrapper"><table class="data-table"><thead><tr><th>الكود</th><th>الخصم</th><th>النوع</th><th>الحالة</th><th></th></tr></thead><tbody>${this.storeData.coupons.map(c=>`<tr><td>${c.code}</td><td>${c.discount}${c.type==='percent'?'%':''}</td><td>${c.type}</td><td>${c.active?'نشط':'غير نشط'}</td><td><button class="btn btn-sm btn-primary toggleCoupon" data-code="${c.code}">تبديل</button> <button class="btn btn-sm btn-danger delCoupon" data-code="${c.code}">حذف</button></td></tr>`).join('')}</tbody></table></div></div>`;
                document.getElementById("addCoupon")?.addEventListener("click",()=>{
                    let code=prompt("الكود"); if(!code) return;
                    let discount=parseFloat(prompt("الخصم"));
                    let type=prompt("النوع (percent/fixed)");
                    let expiry=prompt("تاريخ الانتهاء YYYY-MM-DD");
                    this.storeData.coupons.push({code, discount, type, expiry, active:true});
                    this.saveData(); this.addLog("add_coupon",code); this.renderCoupons(container); this.showToast("تم الإضافة");
                });
                document.querySelectorAll(".toggleCoupon").forEach(btn=>btn.addEventListener("click",()=>{ let c=this.storeData.coupons.find(c=>c.code===btn.dataset.code); if(c){ c.active=!c.active; this.saveData(); this.renderCoupons(container); this.showToast(c.active?"تفعيل":"تعطيل"); } }));
                document.querySelectorAll(".delCoupon").forEach(btn=>btn.addEventListener("click",()=>{ this.storeData.coupons=this.storeData.coupons.filter(c=>c.code!==btn.dataset.code); this.saveData(); this.renderCoupons(container); this.showToast("تم الحذف"); }));
            }

            renderAnalytics(container){
                container.innerHTML=`<div class="page-header"><h1>التحليلات</h1></div><div class="grid-2"><div class="chart-container"><canvas id="catChart"></canvas></div><div class="chart-container"><canvas id="trendChart"></canvas></div></div><div class="chart-container"><button class="btn btn-primary" id="exportExcel">تصدير Excel</button> <button class="btn btn-primary" id="exportPDF">تصدير PDF</button></div>`;
                const catSales={};
                this.storeData.orders.forEach(o=>{ let p=this.storeData.products.find(p=>p.id===o.productId); if(p) catSales[p.category]=(catSales[p.category]||0)+o.total; });
                const ctx1=document.getElementById("catChart")?.getContext('2d');
                if(ctx1 && typeof Chart!=='undefined') new Chart(ctx1,{ type:'doughnut', data:{ labels:Object.keys(catSales), datasets:[{ data:Object.values(catSales), backgroundColor:['var(--primary)','var(--secondary)','var(--success)'] }] } });
                const monthlyTrend={};
                this.storeData.orders.forEach(o=>{ let m=new Date(o.date).toLocaleString('default',{month:'short'}); monthlyTrend[m]=(monthlyTrend[m]||0)+o.total; });
                const ctx2=document.getElementById("trendChart")?.getContext('2d');
                if(ctx2 && typeof Chart!=='undefined') new Chart(ctx2,{ type:'bar', data:{ labels:Object.keys(monthlyTrend), datasets:[{ label:'المبيعات', data:Object.values(monthlyTrend), backgroundColor:'var(--primary)' }] } });
                document.getElementById("exportExcel")?.addEventListener("click",()=>{ const ws=XLSX.utils.json_to_sheet(this.storeData.orders); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Orders"); XLSX.writeFile(wb,`orders_${Date.now()}.xlsx`); this.showToast("تم التصدير"); });
                document.getElementById("exportPDF")?.addEventListener("click",async()=>{ const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text("تقرير المبيعات",10,10); doc.text(`إجمالي الطلبات: ${this.storeData.orders.length}`,10,20); doc.save("report.pdf"); this.showToast("تم تصدير PDF"); });
            }

            renderLogs(container){
                container.innerHTML=`<div class="page-header"><h1>السجلات</h1></div><div class="table-container"><div class="table-wrapper"><table class="data-table"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr></thead><tbody>${this.storeData.logs.slice(0,100).map(l=>`<tr><td>${new Date(l.time).toLocaleString()}</td><td>${l.user}</td><td>${l.action}</td><td>${l.details}</td></tr>`).join('')}</tbody></table></div></div>`;
            }

            renderSettings(container){
                if(!this.hasPermission("admin")){ container.innerHTML='<div class="empty-state">غير مصرح</div>'; return; }
                container.innerHTML=`<div class="page-header"><h1>الإعدادات</h1></div><div class="grid-2"><div class="chart-container"><div class="form-group"><label>اسم المتجر</label><input id="storeName" value="${this.storeData.settings.storeName}"></div><div class="form-group"><label>العملة</label><input id="currency" value="${this.storeData.settings.currency}"></div><div class="form-group"><label>اللغة</label><select id="lang"><option value="ar" ${this.storeData.settings.language==='ar'?'selected':''}>عربي</option><option value="en" ${this.storeData.settings.language==='en'?'selected':''}>English</option></select></div><button class="btn btn-primary" id="saveSettings">حفظ الإعدادات</button></div><div class="chart-container"><button class="btn btn-primary" id="exportJsonBtn">تصدير JSON</button><button class="btn btn-primary" id="importJsonBtn">استيراد JSON</button><input type="file" id="importJsonInput" style="display:none"><button class="btn btn-danger" id="resetData">إعادة ضبط البيانات</button></div></div>`;
                document.getElementById("saveSettings")?.addEventListener("click",()=>{ this.storeData.settings.storeName=document.getElementById("storeName").value; this.storeData.settings.currency=document.getElementById("currency").value; this.storeData.settings.language=document.getElementById("lang").value; this.saveData(); this.applySettings(); this.showToast("تم الحفظ"); this.renderPage(); });
                document.getElementById("exportJsonBtn")?.addEventListener("click",()=>{ let a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(this.storeData,null,2)],{type:"application/json"})); a.download=`backup_${Date.now()}.json`; a.click(); this.showToast("تم التصدير"); });
                document.getElementById("importJsonBtn")?.addEventListener("click",()=>document.getElementById("importJsonInput").click());
                document.getElementById("importJsonInput")?.addEventListener("change",e=>{ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=ev=>{ try{ let imp=JSON.parse(ev.target.result); if(imp.products && imp.orders) { this.storeData=imp; this.saveData(); this.addLog("import","استيراد"); this.renderPage(); this.showToast("تم الاستيراد"); } else throw new Error(); } catch(err){ this.showToast("ملف غير صالح","error"); } }; reader.readAsText(file); });
                document.getElementById("resetData")?.addEventListener("click",()=>{ if(confirm("مسح كل البيانات؟")){ localStorage.clear(); location.reload(); } });
            }

            init(){
                this.applySettings();
                document.getElementById("doLogin").addEventListener("click",()=>{
                    let email=document.getElementById("loginEmail").value;
                    let pass=document.getElementById("loginPassword").value;
                    let user=this.storeData.users.find(u=>u.email===email && atob(u.password)===pass);
                    if(user){
                        this.currentUser=user;
                        document.getElementById("loginContainer").style.display="none";
                        document.getElementById("appLayout").style.display="grid";
                        this.renderPage();
                        this.addLog("login",user.name);
                        this.showToast(`مرحباً ${user.name}`);
                    } else {
                        document.getElementById("loginError").style.display="block";
                        setTimeout(()=>document.getElementById("loginError").style.display="none",2000);
                    }
                });
                document.getElementById("logoutBtn").addEventListener("click",()=>{ this.addLog("logout",""); this.currentUser=null; document.getElementById("loginContainer").style.display="flex"; document.getElementById("appLayout").style.display="none"; this.showToast("تم الخروج"); });
                document.getElementById("mobileMenuToggle").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
                document.getElementById("themeToggle").addEventListener("click",()=>{ this.storeData.settings.darkMode=!this.storeData.settings.darkMode; this.applySettings(); this.saveData(); this.showToast(this.storeData.settings.darkMode?"الوضع الليلي":"الوضع الفاتح"); });
                document.getElementById("langToggle").addEventListener("click",()=>{ this.storeData.settings.language=this.storeData.settings.language==="ar"?"en":"ar"; this.applySettings(); this.saveData(); this.renderPage(); this.showToast(this.storeData.settings.language==="ar"?"تم التبديل للعربية":"Language changed"); });
                document.querySelectorAll(".sidebar-nav a[data-page]").forEach(link=>{ link.addEventListener("click",(e)=>{ e.preventDefault(); this.currentPage=link.dataset.page; this.renderPage(); if(window.innerWidth<768) document.getElementById("sidebar").classList.remove("open"); }); });
            }
        }

        window.storePro = new StoreManagerPro();
    </script>
</body>
</html>
